<title>ITB Reviewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위 표제란(입찰 건·문서 묶음) + 탭, 아래 단일 열 작업면(최대 1280px). 도면 대장처럼 차분한 청록·회색.
   토큰: 색 bg·panel·sunk·ink·muted·line·accent + 의미색 high/med/low/none + 모순 conflict, 추가 공고 add + 형광 hl-1~5(요약표 묶음별).
   글꼴: IBM Plex Sans KR(제목·본문), IBM Plex Mono(값·쪽 번호·문서 번호). */
:root{
  --bg:#f2f5f5; --panel:#ffffff; --sunk:#e8eeed; --ink:#13201f; --muted:#556664; --faint:#5f706e; --line:#d6dfdd; --line-2:#e6ecea;
  --accent:#0c6a65; --accent-ink:#ffffff; --accent-soft:#ddeeec; --chk:#0b6a80; --chk-bg:#d9eff3;
  --high:#b42318; --high-bg:#fdeceb; --med:#7a6300; --med-bg:#fbf3c4; --low:#1d7744; --low-bg:#e3f3e8; --none:#5e6e6c; --none-bg:#e8edec;
  --conflict:#b04a06; --conflict-bg:#fde9d4; --add:#3b5bb5; --add-bg:#e5ebfa;
  --hl-1:#ffe36b; --hl-2:#b5d8ff; --hl-3:#aeeec4; --hl-4:#ffc9a8; --hl-5:#e2d2ff; --hl-ink:#13201f;
  --shadow:0 1px 2px rgb(19 32 31 / .06),0 6px 18px rgb(19 32 31 / .06);
  --f-sans:"IBM Plex Sans KR","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --panel:#141f1e; --sunk:#1a2827; --ink:#e3ebe9; --muted:#9db0ad; --faint:#8a9e9b; --line:#2a3a38; --line-2:#20302e;
  --accent:#5fc4ba; --accent-ink:#081312; --accent-soft:#163331; --chk:#62cbe0; --chk-bg:#0e2f38;
  --high:#ff8f84; --high-bg:#3a1c19; --med:#e8d070; --med-bg:#33300f; --low:#7fd39d; --low-bg:#15301f; --none:#9db0ad; --none-bg:#1f2c2b;
  --conflict:#f4a457; --conflict-bg:#3a240e; --add:#9db4ff; --add-bg:#1c2546;
  --hl-1:#5c4b10; --hl-2:#1e4168; --hl-3:#1d4a31; --hl-4:#5a3218; --hl-5:#40306a; --hl-ink:#f3f6f5;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --panel:#141f1e; --sunk:#1a2827; --ink:#e3ebe9; --muted:#9db0ad; --faint:#8a9e9b; --line:#2a3a38; --line-2:#20302e;
  --accent:#5fc4ba; --accent-ink:#081312; --accent-soft:#163331; --chk:#62cbe0; --chk-bg:#0e2f38;
  --high:#ff8f84; --high-bg:#3a1c19; --med:#e8d070; --med-bg:#33300f; --low:#7fd39d; --low-bg:#15301f; --none:#9db0ad; --none-bg:#1f2c2b;
  --conflict:#f4a457; --conflict-bg:#3a240e; --add:#9db4ff; --add-bg:#1c2546;
  --hl-1:#5c4b10; --hl-2:#1e4168; --hl-3:#1d4a31; --hl-4:#5a3218; --hl-5:#40306a; --hl-ink:#f3f6f5;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14.5px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
h1,h2,h3{margin:0;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.grow{flex:1}
/* header */
.top{background:var(--panel)}
.top .wrap{padding-block:12px 4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.brand h1{font-size:19px;font-weight:700}
.brand .sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--none-bg);color:var(--none);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pkgbar{background:var(--panel);border-bottom:1px solid var(--line-2)}
.pkgbar .wrap{padding-block:8px 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pkgsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pkgbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;max-width:100%;text-align:left}
.pkgbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.pkgbtn .t{display:block;font-size:11px;color:var(--muted);font-weight:400}
.dday{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--sunk)}
.dday.soon{background:var(--high-bg);color:var(--high)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs-wrap{position:relative}
.tabs-wrap::after{content:"";position:absolute;right:0;top:0;bottom:1px;width:28px;pointer-events:none;background:linear-gradient(to right,transparent,var(--panel))}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-right:24px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:flex;gap:6px;align-items:center;padding:9px 12px 10px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.tabs a .n{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.tabs a .c{font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tabs a .c.hot{background:var(--conflict-bg);color:var(--conflict)}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main.wrap{padding-block:18px 56px}
section[hidden]{display:none}
.sec-h{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:4px}
.sec-h h2{font-size:21px}
.lede{color:var(--muted);max-width:820px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.h3{font-size:16px;font-weight:700;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);padding:3px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
/* 판정 배지는 면만, 상태 배지(모순·추가 공고·없음)는 테두리로 구분 */
.r-high,.r-medium,.r-low,.r-none,.r-unknown{border-color:transparent}
.r-high{color:var(--high);background:var(--high-bg)} .r-medium{color:var(--med);background:var(--med-bg)} .r-low{color:var(--low);background:var(--low-bg)} .r-none{color:var(--none);background:var(--none-bg)} .r-unknown{color:var(--chk);background:var(--chk-bg)}
.card.flash{box-shadow:0 0 0 3px var(--accent)}
tr.row.hi td.lab{box-shadow:inset 3px 0 0 var(--high)} tr.row.hi-c td.lab{box-shadow:inset 3px 0 0 var(--conflict)}
mark.refline{outline:2px dashed var(--ink);outline-offset:1px}
.k-q,.k-d{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--accent);color:var(--accent)} .k-d{background:var(--accent);color:var(--accent-ink)}
.banner{border-left:3px solid var(--chk);background:var(--chk-bg);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.banner.warn{border-left-color:var(--conflict);background:var(--conflict-bg)}
.fl{display:flex;flex-wrap:wrap;gap:4px}
.exp h4{font-size:13px;margin:10px 0 2px;color:var(--muted)} .exp tr.sum td{font-weight:700;border-top:1px solid var(--line)}
.ctl{margin:0;padding-left:18px;font-size:13.5px} .ctl li{margin:3px 0}
.thr{width:100%;border-collapse:collapse;font-size:13px} .thr td{padding:5px 6px;border-bottom:1px solid var(--line-2);vertical-align:top} .thr td:first-child{font-weight:600;white-space:nowrap;width:120px}
.f-open{color:var(--conflict);background:var(--conflict-bg)} .f-add{color:var(--add);background:var(--add-bg)} .f-miss{color:var(--conflict);background:transparent;border-style:dashed}
.docref{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.docref:focus-visible{outline:2px solid var(--accent)}
.tscroll{overflow-x:auto;max-width:100%}
/* key strip */
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
@media (max-width:980px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.keys{grid-template-columns:repeat(2,minmax(0,1fr))}}
.keys>div{padding:10px 14px;border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);margin:-1px 0 0 -1px}
.keys .k{font-size:12px;color:var(--muted)}
.keys .v{font-family:var(--f-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.keys .n{font-size:11.5px;color:var(--faint)}
.v.high{color:var(--high)} .v.conflict{color:var(--conflict)}
.verdict{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:880px){.verdict{grid-template-columns:minmax(0,1fr)}}
.toplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.toplist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.exp table{width:100%;border-collapse:collapse;font-size:13px}
.exp th,.exp td{padding:5px 6px;border-bottom:1px solid var(--line-2);text-align:left}
.inp[aria-invalid="true"]{border-color:var(--high)}
.exp td.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.priceinp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px} .priceinp .inp{width:170px}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;min-width:0;width:200px;max-width:100%;font-family:var(--f-mono)}
/* summary table */
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
table.t th,table.t td{padding:8px 9px;border-bottom:1px solid var(--line-2);vertical-align:top;text-align:left}
table.t thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap;border-bottom:1px solid var(--line)}
tr.grp td{background:var(--sunk);font-weight:700;font-size:12.5px;color:var(--muted);padding:5px 9px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--bg)}
tr.row.done td{background:color-mix(in srgb,var(--low-bg) 55%,transparent)}
td.lab{font-weight:600;white-space:nowrap}
td.lab .car{display:inline-block;width:12px;color:var(--faint);font-weight:400}
td.val{font-family:var(--f-mono);font-size:13px;max-width:420px}
td.val .s{font-family:var(--f-sans);font-size:12px;color:var(--muted);margin-top:2px}
.miss{font-family:var(--f-sans);color:var(--muted);font-style:italic}
td.flags{min-width:172px} .exp table.stale{opacity:.45} #pricehint.err,.elmsg.err{color:var(--conflict);font-weight:600}
.elx .elrow{display:grid;grid-template-columns:minmax(140px,1.4fr) 110px 170px minmax(120px,1fr);gap:4px 12px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line-2)}
.elx .elname{align-self:center;font-weight:600} .elx .elf{display:flex;flex-direction:column;gap:2px} .elx .elf .inp{width:100%} .elx .elv{text-align:right;align-self:center} .elx .elmsg{grid-column:1/-1} .elx .elmsg:empty{display:none}
.elx .elsum{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0 2px;border-top:1px solid var(--line)} .elx .elsum b{font-size:16px} .elx .elsum.sub{border-top:0;padding-top:2px;color:var(--muted)} .elx .elv.stale b{opacity:.5}
#reqbox table{width:100%} #reqbox td:last-child{width:120px} #reqbox td:first-child{min-width:0;overflow-wrap:anywhere} td.dep{white-space:nowrap;min-width:64px}
td.ck{text-align:center}
td.ck input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
tr.det td{background:var(--bg);font-size:13px}
.quote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;max-width:95ch}
.cands{display:grid;gap:4px;margin-top:6px}
.cand{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12.5px}
.cand .vv{font-family:var(--f-mono);font-weight:600}
.cand.applied .vv{color:var(--accent)}
.prog{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
/* issues / drafts */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.grid>*{min-width:0}
.icard{padding:12px 14px;border-left:4px solid var(--line)}
.icard.open{border-left-color:var(--conflict)} .icard.add{border-left-color:var(--add)} .icard.high{border-left-color:var(--high)} .icard.medium{border-left-color:var(--med)}
.icard h3{font-size:15px;margin:4px 0 6px}
.vs{display:grid;gap:4px;margin:6px 0}
.vs .row2{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px}
.vs .vv{font-family:var(--f-mono);font-weight:600}
.rule{font-size:12.5px;color:var(--muted)}
.draft{padding:12px 14px}
.draft .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:6px}
.draft .id{font-family:var(--f-mono);font-weight:600}
.draft .en{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border-radius:6px;padding:8px 10px;margin:6px 0;white-space:pre-wrap}
/* source */
.src-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1000px){.src-grid{grid-template-columns:minmax(0,1fr)}}
.srcbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;max-width:100%}
.paper{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px}
.paper .run{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);padding:8px 18px;border-bottom:1px solid var(--line-2)}
.paper pre{margin:0;padding:16px 18px;white-space:pre-wrap;font-family:var(--f-mono);font-size:12.8px;line-height:1.75;overflow-wrap:anywhere}
mark.hl{color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.g1{background:var(--hl-1)} mark.g2{background:var(--hl-2)} mark.g3{background:var(--hl-3)} mark.g4{background:var(--hl-4)} mark.g5{background:var(--hl-5)}
mark.hl.focus{outline:2px solid var(--ink);outline-offset:1px}
mark.hl sup{font-family:var(--f-sans);font-size:10px;font-weight:600;margin-left:2px;vertical-align:.5em}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* side */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:1000px){.side{position:static;max-height:none;order:-1}.side .mlist{max-height:220px;overflow:auto}}
.mlist{display:flex;flex-direction:column}
.mrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13px}
.mrow:hover,.mrow.on{background:var(--accent-soft)}
.mrow .vv{font-family:var(--f-mono);font-size:12.5px;grid-column:1/-1;color:var(--muted)}
/* teams */
.team h3{display:flex;gap:8px;align-items:baseline;font-size:15px}
.team ul{margin:6px 0 0;padding:0;list-style:none}
.team li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:13px;align-items:baseline}
.team li .vv{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);grid-column:1/-1}
/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;max-height:600px;overflow:auto;margin:10px 0}
.msg{padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-width:100%}
.msg.u{background:var(--accent-soft);align-self:flex-end;max-width:85%}
.msg.a{background:var(--bg);border:1px solid var(--line)}
.trace{font-size:12px;color:var(--muted);margin-top:6px;white-space:normal}
.psg{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);white-space:normal;font-size:13px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel)}
.spin{width:15px;height:15px;flex:none;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* guide */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.steps li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13.5px}
.steps .sn{font-family:var(--f-mono);font-weight:600;color:var(--accent);margin-right:6px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 22px}
.gloss div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.gloss b{font-family:var(--f-mono)}

<script id="samples" type="application/json">{"bundle": {"name": "Riverside 600 MW 복합화력 EPC (가상)", "note": "소프트웨어 시험용 가상 입찰 문서 묶음. 발주처·프로젝트·문서 번호는 모두 가상이다.", "docs": [{"name": "V1_Instructions_to_Bidders.pdf", "kind": "pdf", "pages": [{"number": 1, "text": "NORTHBAY ENERGY AUTHORITY\nRIVERSIDE 600 MW COMBINED CYCLE POWER PLANT PROJECT\nTender No. NEA-RCC-2027-01\nVOLUME 1 - INSTRUCTIONS TO BIDDERS\nIssue r0, December 2026\nThis is a fictional document generated for software testing only."}, {"number": 2, "text": "1. General\n1.1 The Employer, Northbay Energy Authority (the \"Employer\"), invites sealed bids for the Riverside 600 MW Combined Cycle Power Plant Project (the \"Project\").\n1.2 The Site is located in the Riverside Industrial Zone, Port Halden, Republic of Nordavia.\n1.3 The scope of work comprises the engineering, procurement, construction, commissioning and testing of a 600 MW combined cycle power plant including two gas turbines, two heat recovery steam generators, one steam turbine, a 400 kV switchyard and all balance of plant.\n1.4 The Contract shall be a lump sum turnkey EPC contract based on the FIDIC Conditions of Contract for EPC/Turnkey Projects (Silver Book), 2017 Edition, as amended by the Particular Conditions.\n2. Bidding Schedule\n2.1 A pre-bid meeting and site visit will be held on 2027-01-20 at 10:00 hrs at the Employer's site office. Attendance is mandatory for all bidders.\n2.2 Bidders may submit requests for clarification in writing no later than 2027-02-10. The Employer will respond to all clarification queries by way of Addenda, which shall form part of the Tender Documents.\n2.3 Bids must be received at the Employer's address no later than 2027-03-16 at 14:00 hrs local time (the bid submission deadline). Late bids shall be rejected.\n2.4 Bids shall remain valid for a period of 180 days after the bid submission deadline."}, {"number": 3, "text": "3. Preparation of Bids\n3.1 The Bid shall comprise two separate envelopes: Envelope A (Technical Proposal) and Envelope B (Price Proposal including the completed Price Schedules).\n3.2 The currency of the Bid shall be United States Dollars (USD). Local costs may be quoted up to 20% in Nordavian Krona (NVK) at the exchange rate published by the Central Bank 28 days prior to the bid submission deadline.\n3.3 The Price Proposal shall contain the completed Schedule of Prices, in which the lump sum price is broken down by plant area. Provisional Sums shall be included only as stated in the Schedule of Prices and shall be re-measured.\n3.4 Each bid shall be accompanied by a Bid Security in the amount of 2% of the Bid Price, in the form of an unconditional bank guarantee valid for 28 days beyond the bid validity period.\n4. Evaluation and Award\n4.1 Bids will be evaluated on a pass/fail technical evaluation followed by commercial evaluation. Technical compliance carries a weighting of 30% and price a weighting of 70%.\n4.2 The Contract will be awarded to the bidder whose bid is technically compliant and has the lowest evaluated price after applying the weighting.\n4.3 Deviations from the Conditions of Contract shall be listed in the Schedule of Deviations. Unlisted deviations will not be considered.\n5. Qualification of Bidders\n5.1 Bidders shall have completed at least two combined cycle power plants of not less than 400 MW each within the last ten years and shall have an average annual construction turnover of not less than USD 800 million over the last three years."}]}, {"name": "V2_Contract_Data.pdf", "kind": "pdf", "pages": [{"number": 1, "text": "VOLUME 2 - CONTRACT DATA\nRiverside 600 MW Combined Cycle Power Plant Project\nThe following data apply to the Conditions of Contract. Clause numbers refer to the General Conditions."}, {"number": 2, "text": "Clause 4.2 Performance Security\nThe Contractor shall deliver a Performance Security in the amount of 10% of the Contract Price within 28 days after receiving the Letter of Acceptance.\nClause 8.2 Time for Completion\nThe Time for Completion of the whole of the Works shall be 36 months from the Commencement Date.\nClause 8.8 Delay Damages\nThe Contractor shall pay liquidated damages to the Employer at the rate of 0.15% of the Contract Price per calendar day of delay.\nThe total amount of delay damages shall not exceed a maximum of 15% of the Contract Price.\nClause 11.3 Defects Notification Period\nThe Defects Notification Period shall be 24 months from the date of Taking Over.\nClause 14.2 Advance Payment\nThe Employer shall make an advance payment of 10% of the Contract Price, against submission of an Advance Payment Guarantee of equal amount.\nClause 14.3 Retention Money\nRetention Money of 5% shall be deducted from each interim payment until the total Retention Money reaches 5% of the Contract Price."}]}, {"name": "V3_Particular_Conditions.pdf", "kind": "pdf", "pages": [{"number": 1, "text": "VOLUME 3 - PARTICULAR CONDITIONS OF CONTRACT\nClause 1.5 Priority of Documents\nThe documents forming the Contract are to be taken as mutually explanatory. In case of ambiguity or discrepancy the priority shall be: the Contract Agreement, the Contract Data, these Particular Conditions, the General Conditions, the Employer's Requirements, the Technical Specifications.\nClause 8.8 Delay Damages\nThe total amount of delay damages under the Contract shall not exceed a maximum of 10% of the Contract Price.\nClause 13.8 Adjustments for Changes in Cost\nThe Contract Price is fixed and firm and shall not be subject to any adjustment for rise or fall in the cost of labour, materials, equipment or other inputs to the Works."}, {"number": 2, "text": "Clause 14.3 Application for Interim Payments\nThe Contractor shall submit monthly statements. The Employer shall pay the amount certified in each Interim Payment Certificate within 56 days after receiving the statement and supporting documents.\nClause 14.9 Retention Money\nRetention Money of 10% shall be deducted from each interim payment until the total Retention Money reaches 10% of the Contract Price. Half shall be released at Taking Over.\nClause 17.6 Limitation of Liability\nThe total liability of the Contractor to the Employer under or in connection with the Contract shall not exceed 150% of the Accepted Contract Amount. Neither Party shall be liable for loss of profit or any indirect or consequential loss, except in cases of fraud or wilful misconduct.\nClause 19 Insurance\nThe Contractor shall effect and maintain Contractor's All Risks insurance for the full replacement value of the Works and third party liability insurance with a minimum limit of USD 50,000,000 per occurrence.\nClause 21 Disputes and Arbitration\nThe Contract shall be governed by the laws of the Republic of Nordavia. Any dispute not settled amicably shall be finally settled by arbitration under the Rules of Arbitration of the International Chamber of Commerce (ICC), with the seat of arbitration in Singapore."}]}, {"name": "V4_Employers_Requirements.pdf", "kind": "pdf", "pages": [{"number": 1, "text": "VOLUME 4 - EMPLOYER'S REQUIREMENTS\n1. Scope\n1.1 The Works shall be designed and constructed in accordance with the Technical Specifications in Volume 5 and the Site Data in Appendix G.\n1.2 The Contractor shall verify the Site Data. The Employer does not warrant the accuracy of the geotechnical information in Appendix G, which is provided for information only.\n2. Local Content\n2.1 The Contractor shall ensure that not less than 30% of the total value of the Works is sourced from Nordavian nationals, local subcontractors and local suppliers (in-country value).\n3. Interfaces\n3.1 The gas supply connection at the plant boundary shall be provided by others as described in Appendix I, Clause 2.6. The Contractor shall coordinate the tie-in schedule with the gas pipeline operator."}]}, {"name": "A1_Addendum_No1.pdf", "kind": "pdf", "pages": [{"number": 1, "text": "ADDENDUM NO. 1\nRiverside 600 MW Combined Cycle Power Plant Project, Tender No. NEA-RCC-2027-01\nIssued 2027-02-20. This Addendum forms part of the Tender Documents and prevails over any earlier issue.\n1. Bid Submission Deadline\nITB Clause 2.3 is amended: Bids must be received no later than 2027-03-30 at 14:00 hrs local time.\n2. Delay Damages\nContract Data Clause 8.8 is amended to read: The total amount of delay damages shall not exceed a maximum of 10% of the Contract Price.\n3. Responses to Clarification Requests\nQuery 07: The Employer confirms that the pre-bid meeting minutes are for information only."}]}]}, "ko": {"name": "한빛시 하수처리장 증설 (가상, 단일 문서)", "docs": [{"name": "샘플_하수처리장_입찰안내서.docx", "kind": "docx", "pages": [{"number": 1, "text": "입찰안내서 (가상 예시 문서)\n이 문서는 소프트웨어 시험용으로 만든 가상 문서입니다.\n제1장 입찰 개요\n1. 공사명: 한빛시 하수처리장 증설 및 고도처리시설 설치공사 (가상 예시)\n2. 발주기관: 한빛시 상하수도사업소\n3. 공사 위치: 한빛시 동구 강변로 일원\n4. 공사 개요: 하수처리 용량 50,000㎥/일 증설, 고도처리시설 설치 및 기존 시설 개량을 포함한다.\n5. 계약방식: 총액 확정 계약, 설계·시공 일괄입찰(턴키) 방식\n제2장 입찰 일정\n6. 현장설명회는 2027년 2월 5일 14시 한빛시청 대회의실에서 개최하며 참석은 선택사항이다.\n7. 입찰 관련 질의는 2027년 2월 20일까지 서면으로 제출하여야 한다.\n8. 입찰서 제출 마감일시는 2027년 3월 10일 17시이며 마감 이후 도착분은 무효로 한다.\n9. 입찰유효기간은 입찰서 제출 마감일로부터 90일로 한다.\n10. 입찰서류는 기술제안서와 가격제안서를 각각 별도 봉투에 넣어 제출한다.\n11. 낙찰자 결정: 기술평가 60점, 가격평가 40점을 합산하여 최고 득점자를 낙찰자로 결정한다.\n제3장 보증 및 대가 지급\n12. 입찰보증금은 입찰금액의 5%로 하며 보증보험증권으로 납부할 수 있다.\n13. 계약보증금은 계약금액의 15%로 한다.\n14. 선급금은 계약금액의 30%를 지급하며 선급금 보증서를 제출하여야 한다.\n15. 기성 대가는 매월 1회 청구하며 발주기관은 청구를 받은 날부터 5일 이내에 지급한다.\n[표]\n구분 | 비율 | 비고\n입찰보증금 | 5% | 보증보험 가능\n계약보증금 | 15% | 현금 또는 보증서\n제4장 공기 및 지체상금\n16. 공사기간은 착공일로부터 30개월로 한다.\n17. 지체상금률은 계약금액의 1000분의 0.5로 하며 지체일수 1일마다 부과한다.\n18. 지체상금 총액은 계약금액의 30%를 초과할 수 없다.\n제5장 계약 조건\n19. 하자담보책임기간은 준공일로부터 3년으로 한다.\n20. 계약금액은 국가를 당사자로 하는 계약에 관한 법률에 따라 물가변동으로 인한 계약금액 조정을 할 수 있다.\n21. 손해배상 책임은 계약금액을 한도로 하며 간접손해는 배상하지 아니한다.\n22. 계약상대자는 공사보험(건설공사보험)과 제3자 배상책임보험에 가입하여야 한다.\n23. 이 계약과 관련한 분쟁은 발주기관 소재지 관할 법원에서 해결한다."}]}]}}</script>

      });
      scores.sort((a, b) => b[0] - a[0] || b[1] - a[1]);
      return scores.slice(0, topK).map(([s, i]) => ({ chunk: this.chunks[i], score: s }));
    }
  }

  // ── rules ─────────────────────────────────────────────
  const MONTHS = "january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec";
  const DATE_RES = [
    /\b(20\d{2})[-./](\d{1,2})[-./](\d{1,2})\b/,
    new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(" + MONTHS + ")\\.?,?\\s+(20\\d{2})\\b", "i"),
    new RegExp("\\b(" + MONTHS + ")\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(20\\d{2})\\b", "i"),
    /(20\d{2})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/,
  ];
  const TIME_RE = /\b(\d{1,2}[:.]\d{2})\s*(?:hrs|hours|h|am|pm|a\.m\.|p\.m\.)?(?:\s*\((?:GMT|UTC)[^)]{0,8}\)|\s*(?:GMT|UTC)\s*[+-]\s*\d{1,2}|\s*\([A-Za-z ]{2,20}time\))?|(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/i;
  const PCT_RE = /(\d+(?:\.\d+)?)\s*(?:%|percent|per\s?cent|퍼센트)/gi;
  const PERMIL_RE = /(\d+)\s*분의\s*(\d+(?:\.\d+)?)/g;
  const DUR_RE = /(?<![\d.])(\d{1,3}(?:\.\d+)?)\s*\)?\s*(?:consecutive\s+|calendar\s+|working\s+)?((?:days?|months?|years?|weeks?)\b|개월|일(?!자|시)|년|주(?!식|요))/i;
  const SENT_SPLIT = /(?<=[A-Za-z가-힣)\]][.;])\s+(?=[A-Z(가-힣\d])|\n+/;
  const NEW_ITEM = /^\s*(?:\d{1,2}(?:\.\d+)+\.?\s|\d{1,2}\.\s|제\s*\d+\s*[조장절]|\[표\]|[A-Z][A-Z \-]{6,}$|(?:Clause|Article|Section|SECTION|ARTICLE)\b)/;

  function mergeLines(text) {
    const out = [];
    for (const line of text.split("\n")) {
      const last = out[out.length - 1];
      if (out.length && last && !/[.;:!?다]\s*$/.test(last) && line.trim() && !NEW_ITEM.test(line) && !line.includes(" | ") && !last.includes(" | "))
        out[out.length - 1] = last.trimEnd() + " " + line.trim();
      else out.push(line);
    }
    return out.join("\n");
  }
  const sentences = text => mergeLines(text).split(SENT_SPLIT).map(s => (s || "").replace(/\s+/g, " ").trim()).filter(s => s.length >= 8);
  const round4 = x => Math.round(x * 1e4) / 1e4;
  const g = n => String(+n.toPrecision(12));

  function percents(s) {
    const vals = [...s.matchAll(PCT_RE)].map(m => parseFloat(m[1]));
    for (const m of s.matchAll(PERMIL_RE)) { const d = parseFloat(m[1]); if (d) vals.push(round4(parseFloat(m[2]) / d * 100)); }
    return vals;
  }
  function durationMonths(s) {
    const m = s.match(DUR_RE); if (!m) return null;
    const n = parseFloat(m[1]), u = m[2].toLowerCase();
    if (u.startsWith("year") || u === "년") return n * 12;
    if (u.startsWith("month") || u === "개월") return n;
    if (u.startsWith("week") || u === "주") return n * 7 / 30.4;
    return n / 30.4;
  }
  const durationDays = s => { const m = durationMonths(s); return m == null ? null : m * 30.4; };
  const PER_DAY = /per (?:calendar |working )?day|(?:each|every|for each|for every) (?:calendar |working )?day|a day of delay|daily|매일|1일|일당|지체일수/i;
  const PER_WEEK = /per week|(?:each|every|for each|for every) week|weekly|1주|매주/i;

  // 값과 함께 원문에서 그 값이 나온 글자(raw)를 돌려준다(원문 형광펜용).
  function valueMatch(item, s) {
    const vt = item.valueType;
    if (vt === "date") {
      for (const r of DATE_RES) {
        const m = s.match(r);
        if (m) { const t = s.slice(m.index + m[0].length, m.index + m[0].length + 48).match(TIME_RE); const d = m[0].replace(/\s+/g, " "); return { v: t ? `${d} ${t[0].trim().replace(/\s+/g, " ")}` : d, raw: m[0] }; }
      }
      return null;
    }
    if (vt === "percent") {
      const ms = [...s.matchAll(PCT_RE)].map(m => m[0]).concat([...s.matchAll(PERMIL_RE)].map(m => m[0]));
      const p = percents(s);
      if (!p.length) {
        if (item.key === "bid_bond" || item.key === "performance_bond") { const a = s.match(AMT_RE); if (a) return { v: a[0].replace(/\s+/g, " "), raw: a[0], amount: true }; }
        if (item.key === "limitation_of_liability" && LOL_FULL.test(s)) { const m = s.match(LOL_FULL); return { v: "100%", raw: m[0], num: 100 }; }
        return null;
      }
      if (item.key === "ld_cap") return { v: g(p[p.length - 1]) + "%", raw: ms[ms.length - 1] };
      if (item.key === "liquidated_damages") {
        const unit = PER_DAY.test(s) ? "/일" : PER_WEEK.test(s) ? "/주" : "";
        return { v: g(p[0]) + "%" + unit, raw: ms[0] };
      }
      return { v: g(p[0]) + "%", raw: ms[0] };
    }
    if (vt === "date") return null;
    if (vt === "duration") { const m = s.match(DUR_RE); return m ? { v: m[0].trim().replace(/^[ )]+|[ )]+$/g, ""), raw: m[0].trim() } : null; }
    if (item.key === "contract_type") {
      const hits = s.match(/lump[- ]sum|unit[- ]price|turnkey|EPC|FIDIC[^,.;]{0,40}|cost[- ]reimbursable|총액|단가|턴키|일괄입찰/gi);
      if (hits) return { v: [...new Set(hits.map(h => h.trim()))].join(", "), raw: hits[0] };
    }
    return null;
  }
  const AMT_RE = /(?:USD|US\$|EUR|KRW|SAR|AED|QAR|GBP|JPY|\$|€|₩)\s?[\d,]+(?:\.\d+)?(?:\s*(?:million|billion|M|bn))?|[\d,]{4,}(?:\.\d+)?\s*(?:원|달러|USD|EUR|KRW)/;
  const LOL_FULL = /계약금액을\s*한도|계약금액\s*범위|(?:shall not exceed|limited to|capped at)\s+(?:the\s+)?(?:Accepted\s+)?Contract\s+(?:Price|Amount|Sum)(?!\s*(?:multiplied|times|x))/i;
  const valueFor = (item, s) => { const m = valueMatch(item, s); return m ? m.v : null; };

  function assessRisk(key, value, evidence, context) {
    const ev = evidence || "";
    const low = (context != null ? context : ev).toLowerCase();
    const p = percents(ev);
    const R = (r, why = "") => [r, why];
    switch (key) {
      case "ld_cap": {
        if (/unlimited|no (?:cap|limit|maximum)|without limit|무제한|한도 없/.test(low)) return R("high", "지체상금 상한이 없습니다.");
        if (!value) return R("high", "지체상금 상한 조항을 찾지 못했습니다. 무제한 노출 가능성을 확인해야 합니다.");
        const v = p.length ? p[p.length - 1] : 0;
        if (v > 15) return R("high", `상한 ${g(v)}%는 통상 수준(10% 내외)보다 높습니다.`);
        if (v > 10) return R("medium", `상한 ${g(v)}%로 통상 수준(10%)을 넘습니다.`);
        return R("low", `상한 ${g(v)}%는 통상 범위입니다.`);
      }
      case "liquidated_damages": {
        if (!value || !p.length) return R("unknown", "지체상금률을 확인하지 못했습니다.");
        const v = p[0];
        if (!PER_DAY.test(ev) && !PER_WEEK.test(ev)) return R("unknown", `${g(v)}%가 하루 기준인지 주 기준인지 문장에서 확인되지 않습니다. 원문을 확인해야 합니다.`);
        if (PER_DAY.test(ev)) {
          if (v > 0.1) return R("high", `일 ${g(v)}%는 높은 편입니다(통상 0.05~0.1%/일).`);
          if (v >= 0.1) return R("medium", `일 ${g(v)}%로 통상 범위 상단입니다.`);
          return R("low", `일 ${g(v)}%는 통상 범위입니다.`);
        }
        if (v > 1) return R("high", `주 ${g(v)}%는 높은 편입니다(통상 0.5~1%/주).`);
        return R("low", `주 ${g(v)}%는 통상 범위입니다.`);
      }
      case "bid_bond": {
        if (!p.length) return value == null ? R("unknown", "입찰보증 조건을 확인하지 못했습니다.") : R("low", `정액 보증(${value})입니다. 입찰가 대비 비율로 바꿔 보려면 입찰가가 필요합니다.`);
        const v = p[0];
        if (v > 5) return R("high", `입찰보증 ${g(v)}%는 통상(2~5%)보다 높습니다.`);
        if (v > 3) return R("medium", `입찰보증 ${g(v)}%로 통상 범위 상단입니다.`);
        return R("low", `입찰보증 ${g(v)}%는 통상 범위입니다.`);
      }
      case "performance_bond": {
        if (!p.length) return value ? R("low", `정액 보증(${value})입니다.`) : R("unknown", "이행보증 조건을 확인하지 못했습니다.");
        const v = p[0];
        if (v > 15) return R("high", `이행보증 ${g(v)}%는 통상(10%)보다 높습니다.`);
        if (v > 10) return R("medium", `이행보증 ${g(v)}%로 통상(10%)을 넘습니다.`);
        return R("low", `이행보증 ${g(v)}%는 통상 범위입니다.`);
      }
      case "advance_payment": {
        if (/no advance payment|advance payment (?:shall|will) not be (?:made|paid|provided)|not be entitled to (?:an |any )?advance|선급금(?:은|을)? 지급하지|선급금 없음/.test(low)) return R("high", "선급금이 없어 초기 자금 부담이 큽니다.");
        if (!value) return R("medium", "선급금 조항을 찾지 못했습니다. 초기 현금흐름을 확인해야 합니다.");
        return R("low", `선급금 ${josa(value, "을", "를")} 받습니다.`);
      }
      case "retention": {
        if (!p.length) return R("unknown", "유보금 비율을 확인하지 못했습니다.");
        const v = p[0];
        if (v > 10) return R("high", `유보금 ${g(v)}%는 높은 편입니다(통상 5~10%).`);
        if (v > 5) return R("medium", `유보금 ${g(v)}%로 통상 범위 상단입니다.`);
        return R("low", `유보금 ${g(v)}%는 통상 범위입니다.`);
      }
      case "warranty": {
        const mo = value ? durationMonths(ev) : null;
        if (mo == null) return R("unknown", "하자담보기간을 확인하지 못했습니다.");
        const mm = Math.round(mo * 10) / 10;
        if (mo > 24.5) return R("high", `하자담보 ${g(mm)}개월은 24개월을 넘습니다(기준: 12개월, 24개월 초과 높음).`);
        if (mo > 12.5) return R("medium", `하자담보 ${g(mm)}개월은 기준 12개월보다 깁니다(24개월까지는 흔함).`);
        return R("low", `하자담보 ${g(mm)}개월은 기준(12개월) 이내입니다.`);
      }
      case "limitation_of_liability": {
        if (/unlimited|no limit|shall not be limited|without limit|무제한|제한(?:하지| 없)/.test(low)) return R("high", "계약자 책임이 무제한이거나 제한되지 않습니다.");
        if (!low) return R("high", "책임 한도 조항을 찾지 못했습니다. 무제한 책임 가능성을 확인해야 합니다.");
        if (p.length && p[0] > 100) return R("high", `책임 한도가 계약금액의 ${g(p[0])}%로 높습니다.`);
        if (!/consequential|indirect|간접/.test(low)) return R("medium", "간접·결과적 손해 면책 문구를 함께 확인해야 합니다.");
        return R("low", "책임 한도와 간접손해 면책이 있습니다.");
      }
      case "price_adjustment": {
        if (!low) return R("unknown", "물가변동 조항을 찾지 못했습니다.");
        if (/not (?:be )?subject to (?:any )?(?:price )?adjust|no (?:price )?(?:adjustment|escalation)|fixed and firm|firm price|shall remain fixed|조정하지 (?:않|아니)|고정/.test(low))
          return R("high", "물가변동 조정이 없는 고정가격입니다. 자재·인건비 상승 위험을 계약자가 모두 집니다.");
        return R("low", "물가변동 조정 조항이 있습니다.");
      }
      case "bid_validity": {
        const d = value ? durationDays(ev) : null;
        if (d == null) return R("unknown");
        if (d > 180) return R("medium", `입찰 유효기간 ${Math.round(d)}일은 깁니다. 가격 유지 부담이 있습니다.`);
        return R("low");
      }
      case "payment_terms": {
        const d = value ? durationDays(ev) : null;
        if (d == null) return R("unknown", "기성 지급 기한을 확인하지 못했습니다.");
        if (d > 84.5) return R("high", `지급 기한 ${Math.round(d)}일은 깁니다(FIDIC 표준 56일).`);
        if (d > 56.5) return R("medium", `지급 기한 ${Math.round(d)}일은 FIDIC 표준 56일보다 깁니다.`);
        return R("low", `지급 기한 ${Math.round(d)}일은 FIDIC 표준(56일) 이내입니다.`);
      }
      case "governing_law": {
        if (!ev) return R("unknown");
        if (/arbitrat|icc|siac|lcia|uncitral|중재/.test(low)) return R("low", "국제중재 조항이 있습니다.");
        if (/court|법원/.test(low)) return R("medium", "중재 없이 현지 법원 관할입니다.");
        return R("none");
      }
      case "price_schedule": {
        if (!ev) return R("none");
        if (/lump sum|총액/.test(low)) return R("medium", "본체가 총액(lump sum)이라 물량 증가 위험을 계약자가 집니다(물량 산출 검증 필요)." + (/provisional sum|잠정/.test(low) ? " 잠정금액(PS) 항목만 실제 물량으로 정산됩니다." : ""));
        if (/re-?measur|quantities (?:are|shall be) (?:approximate|estimated)|정산/.test(low)) return R("low", "물량을 실제로 재서 정산하는 조건입니다.");
        if (/provisional sum|잠정/.test(low)) return R("none", "잠정금액(PS) 조항이 있습니다. 본체 가격 방식은 계약 방식 항목을 보세요.");
        return R("none");
      }
      case "prequalification": {
        if (!ev) return R("unknown", "입찰 참가 자격 조항을 찾지 못했습니다. 질의로 확인해야 합니다.");
        return R("unknown", "실적·매출 요건을 회사 실적과 대조해야 합니다(영업). 못 맞추면 입찰이 무효입니다.");
      }
      case "site_data_reliance": {
        if (!ev) return R("unknown", "조사 자료를 어디까지 믿을 수 있는지 정한 조항을 찾지 못했습니다.");
        if (/for information only|does not warrant|not warrant|no responsibility|shall verify|참고용|책임지지|보증하지/.test(low))
          return R("high", "발주처가 조사 자료의 정확성을 보증하지 않습니다. 자료 오류(지반·수심 등)의 비용을 계약자가 집니다.");
        return R("low", "조사 자료를 믿고 쓸 수 있는 조항이 있습니다.");
      }
      case "interfaces": {
        if (!ev) return R("none");
        return R("medium", "다른 계약자·발주처가 맡는 범위가 있습니다. 경계 조건과 지연 시 보상을 확인해야 합니다.");
      }
      case "local_content": {
        if (!p.length) return ev ? R("low") : R("none");
        const v = p[0];
        if (v >= 50) return R("high", `현지화 의무 ${g(v)}%는 높습니다.`);
        if (v >= 30) return R("medium", `현지화 의무 ${g(v)}%입니다.`);
        return R("low");
      }
    }
    return R("none");
  }

  function bestSentence(item, index) {
    const anchor = new RegExp(item.anchors, "i");
    const exclude = item.exclude ? new RegExp(item.exclude, "i") : null;
    const qtok = new Set(tokenize(item.query));
    let best = null;
    index.search(item.query, 6).forEach(({ chunk, score }, rank) => {
      const sents = sentences(chunk.text);
      sents.forEach((s, k) => {
        if (!anchor.test(s) || (exclude && exclude.test(s))) return;
        const vm = valueMatch(item, s), val = vm ? vm.v : null;
        const overlap = new Set(tokenize(s).filter(t => qtok.has(t))).size;
        const sc = score * (1 - 0.08 * rank) + overlap * 0.6 + (val ? 4 : 0) - s.length / 600 - (/^[a-z]/.test(s) ? 2 : 0);
        if (!best || sc > best.sc) best = { sc, s, val, raw: vm ? vm.raw : null, vm, chunk, ctx: sents.slice(k, k + 2).join(" ") };
      });
    });
    return best;
  }

  function extractRules(doc, index) {
    return ITEMS.map(item => {
      const best = bestSentence(item, index);
      let value = null, evidence = "", page = null, section = "", ctx = "";
      if (best) {
        ({ s: evidence, val: value, ctx } = best); page = best.chunk.page; section = best.chunk.section;
        if (value == null && (item.valueType === "text" || item.key === "limitation_of_liability"))
          value = evidence.length <= 220 ? evidence : evidence.slice(0, 217) + "…";
      }
      const [risk, reason] = assessRisk(item.key, value, evidence, ctx);
      return { key: item.key, label: item.label, category: item.category, found: value != null, value: value || "",
        summary: "", evidence: evidence.slice(0, 600), pages: page ? [page] : [], section, risk, risk_reason: reason, source: "rule" };
    });
  }

  function offlineAnswer(index, question) {
    const expanded = expandQuery(question);
    const hits = index.search(expanded, 6);
    if (!hits.length) return [];
    const qtok = new Set(tokenize(expanded)), top = hits[0].score, out = [];
    for (const { chunk, score } of hits) {
      if (score < top * 0.3) break;
      const sents = sentences(chunk.text);
      const ov = s => new Set(tokenize(s).filter(t => qtok.has(t))).size;
      const pick = sents.map((s, k) => [k, ov(s)]).sort((a, b) => b[1] - a[1]).slice(0, 3).filter(x => x[1] > 0).map(x => x[0]).sort((a, b) => a - b);
      if (pick.length) out.push({ page: chunk.page, section: chunk.section, text: pick.map(k => sents[k]).join(" … ") });
    }
    return out;
  }

  // ── 입찰 문서 묶음(패키지) ─────────────────────────────
  // 우선순위는 FIDIC 계열 PCC 1.5의 흔한 순서를 기본으로 한다. 추가 공고는 앞선 판을 바꾼다.
  const DOC_TYPES = [
    { code: "ADD", label: "추가 공고", en: "Addendum", rank: 0, re: /addendum|corrigendum|amendment no|추가\s*공고|정정\s*공고|변경\s*공고/i },
    { code: "CA", label: "계약서", en: "Contract Agreement", rank: 1, re: /contract agreement|form of agreement|계약서/i },
    { code: "CD", label: "계약 데이터(CD)", en: "Contract Data", rank: 2, re: /contract data|appendix to tender|계약\s*데이터/i },
    { code: "PCC", label: "특수조건(PCC)", en: "Particular Conditions", rank: 3, re: /particular conditions|special conditions|특수\s*조건|특약/i },
    { code: "GCC", label: "일반조건(GCC)", en: "General Conditions", rank: 4, re: /general conditions|일반\s*조건/i },
    { code: "BDS", label: "입찰 데이터 시트(BDS)", en: "Bid Data Sheet", rank: 5, re: /bid data sheet|tender data sheet|입찰\s*데이터/i },
    { code: "ITB", label: "입찰지침(ITB)", en: "Instructions to Bidders", rank: 5, re: /instructions to (?:bidders|tenderers)|invitation to (?:bid|tender)|request for (?:proposal|tender)|입찰\s*(?:안내|지침|공고)|입찰안내서/i },
    { code: "ER", label: "발주처 요구사항(ER)", en: "Employer's Requirements", rank: 6, re: /employer'?s requirements|과업\s*(?:지시|내용)/i },
    { code: "TS", label: "기술 시방(TS)", en: "Technical Specifications", rank: 7, re: /technical specification|시방서/i },
    { code: "APP", label: "부록·참고 자료", en: "Appendix", rank: 8, re: /appendix|annex|부록|별첨/i },
    { code: "ETC", label: "기타", en: "Document", rank: 9, re: /$^/ },
  ];
  const TYPE = Object.fromEntries(DOC_TYPES.map(t => [t.code, t]));
  function detectDocType(name, firstText) {
    const nm = String(name || "").replace(/\.[^.]+$/, "").replace(/[_\-.]+/g, " ");
    for (const t of DOC_TYPES) if (t.re.test(nm)) return t.code;
    const head = String(firstText || "").slice(0, 500);
    for (const t of DOC_TYPES) if (t.re.test(head)) return t.code;
    return "ETC";
  }
  const addNo = (name, text) => { const m = (name + " " + String(text || "").slice(0, 300)).match(/(?:no\.?\s*|addendum\s*|#\s*)(\d+)|(\d+)\s*차/i); return m ? +(m[1] || m[2]) : 0; };

  const MONTH_N = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  const pad = n => String(n).padStart(2, "0");
  function isoDate(v) {
    let m;
    if ((m = v.match(/(20\d{2})[-./](\d{1,2})[-./](\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    if ((m = v.match(/(20\d{2})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    if ((m = v.match(new RegExp("(\\d{1,2})(?:st|nd|rd|th)?\\s+(" + MONTHS + ")\\.?,?\\s+(20\\d{2})", "i")))) return `${m[3]}-${pad(MONTH_N[m[2].toLowerCase().slice(0, 3)] || MONTH_N[m[2].toLowerCase()])}-${pad(m[1])}`;
    if ((m = v.match(new RegExp("(" + MONTHS + ")\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(20\\d{2})", "i")))) return `${m[3]}-${pad(MONTH_N[m[1].toLowerCase().slice(0, 3)])}-${pad(m[2])}`;
    return null;
  }
  function norm(item, value, sentence) {
    if (!value) return null;
    if (item.valueType === "percent") {
      const n = parseFloat(value); if (isNaN(n) || !/%/.test(value)) return value.length < 40 ? value.replace(/\s+/g, " ").toLowerCase() : null;
      if (item.key === "liquidated_damages") { const u = /\/일/.test(value) ? "d" : /\/주/.test(value) ? "w" : "?"; return u === "w" ? `${Math.round(n / 7 * 1e4) / 1e4}d` : `${n}${u}`; }
      return String(n);
    }
    if (item.valueType === "date") { const d = isoDate(value); if (!d) return null; const t = value.match(/(\d{1,2})[:.](\d{2})|(\d{1,2})\s*시/); return t ? `${d}T${pad(t[1] || t[3])}:${t[2] || "00"}` : d; }
    if (item.valueType === "duration") { const d = durationDays(value); if (d == null) return null; return d <= 120 ? String(Math.round(d)) : String(Math.round(d / 30.4)) + "mo"; }
    return null;
  }

  function buildPackage(docs) {
    docs.forEach((d, i) => {
      d.idx = i + 1;
      d.type = d.type || detectDocType(d.name, d.pages[0] && d.pages[0].text);
      d.addNo = d.type === "ADD" ? (addNo(d.name, d.pages[0] && d.pages[0].text) || i + 1) : 0;
      if (!d.chunks) d.chunks = chunkPages(d.pages);
      d.index = new BM25(d.chunks);
    });
    return { docs };
  }

  // 근거 문장을 실제로 관장하는 조항 제목(청크 안에서 문장 앞의 마지막 제목)
  // 반환: { sec: 조항 제목, sub: 문장 앞 가장 가까운 번호(예 1.2) }
  function sectionFor(chunk, sentence) {
    const key = sentence.slice(0, 24), lines = chunk.text.split("\n");
    let sec = chunk.start || "", sub = "", item = "", pos = 0;
    const flat = chunk.text.replace(/\s+/g, " "), at = flat.indexOf(key.replace(/\s+/g, " "));
    if (at < 0) return { sec: chunk.section, sub: "", item: "" };
    for (const l of lines) {
      if (pos > at) break;
      if (HEADING_RE.test(l) && l.trim().length < 100) sec = l.trim();
      const m = l.match(/^\s*(\d{1,2}(?:\.\d+)+)\.?\s/); if (m) sub = m[1];
      else if (HEADING_RE.test(l)) sub = "";
      const mi = l.match(/^\s*(\d{1,2})\.\s/); if (mi) item = mi[1];
      pos += l.replace(/\s+/g, " ").length + 1;
    }
    return { sec, sub, item };
  }
  // 질의서에 쓰는 조항 인용(예: "Clause 14.3", "ITB 2.3")
  function clauseOf(c) {
    let m = c.evidence.match(/^(?:Sub-)?(?:Clause|Article|ITB|GCC|PCC)?\s*(\d+(?:\.\d+)+)\s/i) || c.evidence.match(/^(\d+(?:\.\d+)+)\s/);
    if (m) return `Clause ${m[1]}`;
    if (c.sub) return `Clause ${c.sub}`;
    m = (c.section || "").match(/((?:Sub-)?Clause|Article|Section)\s+([\dA-Z][\d.]*)/i); if (m) return `${m[1]} ${m[2].replace(/\.$/, "")}`;
    m = (c.section || "").match(/^(\d+(?:\.\d+)*)\.?\s/); if (m) return `Clause ${m[1]}`;
    m = (c.section || "").match(/제\s*\d+\s*[조장절]/); if (m) return m[0];
    return "";
  }
  const CHANGE_RE = /amend|shall (?:now )?read|is (?:hereby )?(?:replaced|changed|revised|modified|deleted)|replace[sd]? by|substitut|(?:is|are|has been) extended|postponed|변경|정정|개정|연장|수정한다|으로 한다/i;
  const NOCHANGE_RE = /not accepted|no change|remain(?:s)? unchanged|unchanged|is rejected|not agreed|불수용|변경\s*없|그대로/i;

  function candidateFor(item, d) {
    const b = bestSentence(item, d.index);
    if (!b) return null;
    let value = b.val;
    if (value == null && (item.valueType === "text" || item.key === "limitation_of_liability"))
      value = b.s.length <= 220 ? b.s : b.s.slice(0, 217) + "…";
    const sf = sectionFor(b.chunk, b.s);
    const c = { docId: d.id, docName: d.name, type: d.type, rank: rankOf(item, d.type), addNo: d.addNo, page: b.chunk.page, section: sf.sec, sub: sf.sub,
      value, raw: b.raw, evidence: b.s.slice(0, 600), ctx: b.ctx, sc: b.sc, norm: norm(item, value, b.s), amount: !!(b.vm && b.vm.amount) };
    c.clause = clauseOf(c);
    if (d.type === "ADD") {
      const item = (sf.item || (c.section.match(/^(\d+)\./) || [])[1] || ""), tgt = (c.evidence + " " + c.ctx).match(/\b(ITB|BDS|Contract Data|CD|PCC|GCC|Particular Conditions|General Conditions|ER|Employer's Requirements|TS)\s+(?:Sub-)?Clause\s+([\d.]+\d)/i);
      c.clause = `Addendum No. ${d.addNo}${item ? `, Item ${item}` : ""}${tgt ? ` (amending ${tgt[1]} Clause ${tgt[2]})` : ""}`;
    }
    return c;
  }
  // 입찰 절차 항목은 입찰지침이 계약 문서보다 앞선다(추가 공고는 늘 맨 앞)
  const rankOf = (item, type) => (PROCEDURAL.has(item.key) && (type === "ITB" || type === "BDS")) ? (type === "BDS" ? 0.4 : 0.5) : TYPE[type].rank;
  const SEV = { high: 4, medium: 3, unknown: 2, low: 1, none: 0 };

  const LEGAL = new Set(["liquidated_damages", "ld_cap", "bid_bond", "performance_bond", "warranty", "retention", "advance_payment", "payment_terms"]);
  function analyzePackage(pkg, policy) {
    policy = policy || {};
    const items = ITEMS.map(item => {
      let cands = pkg.docs.map(d => candidateFor(item, d)).filter(c => c && c.value != null);
      // 추가 공고는 '바꾼다'는 문장일 때만 값 변경으로 본다(질의 회신·불수용 문장은 제외)
      cands = cands.filter(c => c.type !== "ADD" || (CHANGE_RE.test(c.evidence + " " + c.ctx) && !NOCHANGE_RE.test(c.evidence)));
      if (item.valueType === "text") cands = cands.length ? [cands.slice().sort((a, b) => b.sc - a.sc)[0]] : [];
      let applied = null, conflict = null;
      if (cands.length) {
        const distinct = [...new Set(cands.map(c => c.norm).filter(v => v != null))];
        const byRank = cands.slice().sort((a, b) => a.rank - b.rank || b.addNo - a.addNo || b.sc - a.sc);
        if (item.valueType === "text" || distinct.length <= 1) applied = byRank[0];
        else {
          const adds = cands.filter(c => c.type === "ADD").sort((a, b) => b.addNo - a.addNo);
          const values = byRank.map(c => ({ value: c.value, docName: c.docName, type: c.type, page: c.page, docId: c.docId, clause: c.clause }));
          if (adds.length) {
            applied = adds[0];
            conflict = { status: "addendum", values, rule: `추가 공고(${applied.docName})가 앞선 값을 바꿨습니다. 최신 판 값을 적용합니다.` };
          } else {
            applied = byRank[0];
            conflict = { status: "open", values, rule: `문서마다 값이 달라 적용 값을 정하지 않았습니다(값 미정). 우선순위로는 ${TYPE[applied.type].label} 값이 앞서지만, 질의 마감 전에 질의로 확인해야 합니다. 판정과 금액은 가장 불리한 값 기준입니다.` };
          }
        }
      }
      const base = { key: item.key, label: item.label, category: item.category, group: item.group, dept: item.dept, en: item.en, use: item.use, summary: "", source: "rule",
        candidates: cands.map(c => ({ docId: c.docId, docName: c.docName, type: c.type, page: c.page, value: c.value, raw: c.raw, evidence: c.evidence, section: c.section, clause: c.clause, amount: c.amount })) };
      if (!applied) {
        const [risk, reason] = assessRisk(item.key, null, "", "");
        const r = SEV[risk] >= SEV.medium ? risk : "unknown";
        return { ...base, found: false, value: "", raw: null, evidence: "", pages: [], docId: null, docName: "", docType: null, section: "", clause: "", conflict: null,
          risk: r, risk_reason: r === risk && reason ? reason : "문서에서 이 항목을 찾지 못했습니다." + (MUST.includes(item.key) ? " 질의로 확인해야 합니다." : "") };
      }
      let [risk, reason] = assessRisk(item.key, applied.value, applied.evidence, applied.ctx);
      let value = applied.value;
      if (policy.domestic && LEGAL.has(item.key)) { risk = "none"; reason = "국내 공공계약: 법령·계약예규가 정하는 값일 수 있어 해외 통상치로 판정하지 않습니다. 법정 기준과 같은지 계약법무가 확인하세요."; }
      if (conflict && conflict.status === "open") {
        // 가장 불리한 값 기준 판정
        let worst = null;
        for (const c of cands) { const [r2, why] = assessRisk(item.key, c.value, c.evidence, c.ctx); if (!worst || SEV[r2] > SEV[worst[0]]) worst = [r2, why, c]; }
        risk = SEV[worst[0]] >= SEV.medium ? worst[0] : "medium";
        reason = `값 미정(모순). ${worst[1] || ""}`.trim();
        value = "";
      }
      return { ...base, found: true, undetermined: !!(conflict && conflict.status === "open"), value, raw: applied.raw, evidence: applied.evidence,
        pages: [applied.page], docId: applied.docId, docName: applied.docName, docType: applied.type, section: applied.section, clause: applied.clause,
        conflict, risk, risk_reason: reason };
    });
    const ct = items.find(i => i.key === "contract_type"), ps = items.find(i => i.key === "price_schedule");
    if (ct && ps && ps.found && /lump|총액/i.test(ct.value) && ps.risk !== "medium" && ps.risk !== "high") {
      ps.risk = "medium"; ps.risk_reason = "계약 방식이 총액(lump sum)이라 물량 증가 위험을 계약자가 집니다. 잠정금액(PS) 등 정산 조항이 있는 항목만 실제 물량으로 정산됩니다.";
    }
    return items;
  }

  // 이탈 허용 여부·국내 공공계약 여부
  function policyOf(pkg) {
    const all = pkg.docs.map(d => d.pages.map(p => p.text).join("\n")).join("\n");
    const hangul = (all.match(/[가-힣]/g) || []).length, latin = (all.match(/[A-Za-z]/g) || []).length;
    const korean = hangul > latin;
    const domestic = korean && /국가를\s*당사자로|지방자치단체를\s*당사자로|조달청|공공기관|발주기관|입찰참가자격/.test(all);
    const m = all.match(/[^.\n]*(?:deviation|qualified bid|conditional (?:bid|tender))[^.\n]*(?:non-responsive|rejected|shall not be (?:permitted|considered|accepted)|not be permitted)[^.\n]*|[^.\n]*(?:조건부\s*입찰|이탈)[^.\n]*(?:무효|허용하지|불허)[^.\n]*/i);
    const listed = m && /not listed|unlisted|unless (?:stated|listed|included)|other than those (?:listed|stated)|not (?:included|stated) in the schedule/i.test(m[0]);
    const forbidden = !!m && !listed;
    let ev = ""; if (m) { const i = all.indexOf(m[0]); const ls = all.lastIndexOf("\n", i) + 1, le = all.indexOf("\n", i + m[0].length); ev = all.slice(ls, le < 0 ? undefined : le).trim().slice(0, 220); }
    return { korean, domestic, forbidden, evidence: forbidden ? ev : "",
      note: forbidden ? "입찰지침이 이탈을 허용하지 않아 이탈 요청 대신 질의로 바꿨습니다." : domestic ? "국내 공공계약은 계약 조건 이탈을 입찰서에 붙일 수 없어 이탈·조건 완화 요청을 만들지 않았습니다. 법정 기준 항목은 '정보'로 둡니다." : "" };
  }
  // 서로 다른 사업의 문서가 섞였는지: 입찰 번호가 다르거나 국문·영문 문서가 섞였을 때
  function mixWarning(pkg) {
    const nos = new Map(), langs = new Set();
    for (const d of pkg.docs) {
      const t = d.pages.map(p => p.text).join("\n");
      const m = t.match(/(?:Tender|Bid|Contract|RFP|ITB)\s*(?:No\.?|Number|Ref\.?)\s*[:.]?\s*([A-Z0-9][A-Z0-9\-\/]{3,})|공고\s*번호\s*[:：]?\s*([0-9A-Z\-]{4,})/i);
      if (m) nos.set(d.name, (m[1] || m[2]).toUpperCase());
      const h = (t.match(/[가-힣]/g) || []).length, l = (t.match(/[A-Za-z]/g) || []).length; if (h + l > 200) langs.add(h > l ? "ko" : "en");
    }
    if (new Set(nos.values()).size > 1) return `문서마다 입찰 번호가 다릅니다(${[...new Set(nos.values())].join(", ")}). 다른 입찰 건의 문서가 섞였다면 따로 올리세요. 섞인 채로 대조하면 모순이 잘못 잡힙니다.`;
    if (langs.size > 1) return "국문 문서와 영문 문서가 섞여 있습니다. 같은 입찰 건의 번역본이 아니라면 따로 올리세요. 섞인 채로 대조하면 모순이 잘못 잡힙니다.";
    return "";
  }

  // 다른 문서를 가리키는 참조 중 묶음에 없는 것
  const REF_RE = /\b(Appendix|Annex|Schedule|Volume|Vol\.)\s+([A-Z]|\d{1,2}|[IVX]{1,4})\b|(부록|별첨)\s*([A-Z0-9]{1,2})/g;
  function crossRefs(pkg) {
    const found = new Map();
    // 문서의 표제부: 파일명 + 첫 쪽에서 첫 번호 조항 앞까지의 줄(최대 6줄)
    const headOf = d => { const out = []; for (const l of (d.pages[0] ? d.pages[0].text.split("\n") : []).slice(0, 6)) { if (/^\s*(?:\d+(?:\.\d+)*\.?\s|Clause\b|제\s*\d)/.test(l)) break; out.push(l); }
      return (d.name.replace(/[_\-.]+/g, " ") + " " + out.join(" ")).toLowerCase(); };
    const heads = pkg.docs.map(headOf);
    pkg.docs.forEach((d, di) => { for (const p of d.pages) {
      for (const line of p.text.split("\n")) {
        for (const m of line.matchAll(REF_RE)) {
          const kind = m[1] ? m[1].replace("Vol.", "Volume") : m[3];
          const id = m[2] || m[4], target = `${kind} ${id}`;
          if (heads[di].includes(target.toLowerCase())) continue; // 문서 자신의 표제
          if (!found.has(target)) found.set(target, { target, refs: [] });
          const r = found.get(target);
          if (r.refs.length < 4) r.refs.push({ docId: d.id, docName: d.name, page: p.number, text: line.trim().slice(0, 220) });
        }
      }
    } });
    return [...found.values()].map(r => {
      const t = r.target.toLowerCase(), m = t.match(/^volume (\d+)$/);
      const present = heads.some(h => h.includes(t) || (m && new RegExp(`(^|\\s)v${m[1]}\\s`).test(h)));
      return { ...r, present };
    }).sort((a, b) => a.present - b.present || a.target.localeCompare(b.target));
  }

  // 받침에 맞춘 조사: josa("유보금","이","가") → "유보금이"
  function josa(w, a, b) { const t = String(w).trim(), c = t.charCodeAt(t.length - 1);
    if (c >= 0xac00 && c <= 0xd7a3) return t + (((c - 0xac00) % 28) ? a : b);
    if (/%$/.test(t)) return t + b;
    return t + (/[013678LMNR]$/i.test(t) ? a : b); }
  const enVal = v => String(v).replace(/%\/일/, "% of the Contract Price per day").replace(/%\/주/, "% of the Contract Price per week");
  const cite = v => v.type === "ADD" ? (v.clause || "Addendum") : `${TYPE[v.type].en}${v.clause ? ", " + v.clause : ""}`;
  const citeKo = v => v.type === "ADD" ? (v.clause || "추가 공고") : `${TYPE[v.type].label}${v.clause ? " " + v.clause : ""}`;
  function drafts(items, refs, policy) {
    policy = policy || {};
    const by = Object.fromEntries(items.map(i => [i.key, i]));
    const Q = [], D = [], ko = !!policy.korean;
    const q = (o) => Q.push({ docId: null, page: null, refs: [], ...o });
    for (const it of items) {
      if (!it.conflict || it.conflict.status !== "open") continue;
      const vs = it.conflict.values;
      q({ item: it.key, label: it.label, basis: "모순", owner: it.dept, refs: vs.map(v => ({ docId: v.docId, page: v.page, hl: (it.candidates.find(c => c.docId === v.docId) || {}).evidence || "" })),
        where: vs.map(v => `${citeKo(v)} (${v.docName} p.${v.page})`).join(" · "),
        en: ko ? `${josa(it.label, "이", "가")} ${vs.map(v => `${citeKo(v)}에는 ${v.value}`).join(", ")}(으)로 서로 다르게 기재되어 있습니다. 적용되는 값을 확인하여 주시고, 정정 공고로 일치시켜 주시기 바랍니다.`
          : `${vs.map(v => `${cite(v)} states ${enVal(v.value)}`).join(", whereas ")}. Please confirm the applicable ${it.en.toLowerCase()} and amend the Tender Documents by Addendum.`,
        ko: `${josa(it.label, "이", "가")} 문서마다 다릅니다: ${vs.map(v => `${citeKo(v)} ${v.value}`).join(" vs ")}. 적용 값을 확인하고 추가 공고로 정정해 달라고 요청합니다.` });
    }
    for (const k of MUST) {

        ko: `${it.label} 조항을 찾지 못했습니다. 조건과 근거 조항을 확인 요청합니다.` });
    }
    for (const r of refs.filter(r => !r.present)) {
      const f = r.refs[0];
      q({ item: null, label: `빠진 참조 문서: ${r.target}`, basis: "빠진 참조 문서", owner: "영업", refs: [{ docId: f.docId, page: f.page, hl: f.text, line: true }], where: `${f.docName} p.${f.page}`,
        en: ko ? `입찰 문서가 ${r.target} 문서를 참조하나 배포된 입찰 문서에 포함되어 있지 않습니다. 해당 문서를 배포하여 주시기 바랍니다.` : `The Tender Documents refer to ${r.target}, which was not included in the documents issued to Bidders. Please issue ${r.target}.`,
        ko: `본문이 ${r.target} 문서를 참조하지만 받은 입찰 문서에 없습니다. 배포를 요청합니다.` });
    }
    const sd = by.site_data_reliance;
    if (sd && sd.found && sd.risk === "high") q({ item: sd.key, label: sd.label, basis: "리스크 높음", owner: sd.dept, refs: [{ docId: sd.docId, page: sd.pages[0], hl: sd.evidence }], where: `${citeKo(sd.candidates[0])} (${sd.docName} p.${sd.pages[0]})`,
      en: ko ? "입찰 시 제공된 현장·지반 자료를 설계와 가격 산정의 근거로 사용할 수 있는지, 자료가 실제와 다를 경우 비용은 누가 부담하는지 확인하여 주시기 바랍니다."
        : `Please confirm whether Bidders may rely on the site and geotechnical data issued with the Tender Documents (${cite(sd.candidates[0])}) for design and pricing, and which party bears the cost of any inaccuracy.`,
      ko: "제공된 현장·지반 자료를 설계·가격에 믿고 써도 되는지, 틀리면 비용은 누가 지는지 확인 요청합니다." });

  // 계약금액이 주어지면 비율 항목을 금액으로 바꾼다. 모순이면 범위로.
  function exposure(items, price) {

    const pcts = it => { if (!it || !it.found) return []; const vals = (it.undetermined ? it.candidates.map(c => c.value) : [it.value]).filter(v => /^\s*[\d.]+\s*%/.test(v)).map(v => parseFloat(v)); return vals; };
    const row = (k, label, note) => { const it = by[k], v = pcts(it); if (!v.length) return { key: k, label, note, pct: null, lo: null, hi: null, item: it, fixed: it && it.found && it.candidates.some(c => c.amount) ? it.value : null };

    return { loss, bank, bankSum: sum(bank.slice(1)), bankSumLabel: "계약 후 동시 최대(이행+선급금 보증)", cash, unpriced };
  }

  // 기술 요구사항 적합성 표: 요구사항·시방 문서의 'shall/must/하여야' 문장
  function requirements(pkg, max = 60) {
    const pref = pkg.docs.filter(d => d.type === "ER" || d.type === "TS");
    const fallback = !pref.length;
    const docs = fallback ? pkg.docs.filter(d => d.type !== "ADD" && d.type !== "ITB" && d.type !== "BDS") : pref;
    // 계약 문서로 넘어갈 때는 요약표가 다루는 상업 조항(앞 문장 문맥 포함), 우선순위 조항, 발주처가 주어인 문장을 뺀다
    const commercial = new RegExp(ITEMS.filter(i => ["상업 조건", "입찰 절차", "일정"].includes(i.group)).map(i => `(?:${i.anchors})`).join("|") + "|priority|precedence|ambiguit|discrepanc|우선순위", "i");

    s.onerror = () => { delete loaded[src]; no(new Error("문서 해석 라이브러리를 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 올려 주세요.")); }; document.head.appendChild(s); });

async function readPdf(buf, onp) {
  await loadScript(CDN + "pdf.js/3.11.174/pdf.min.js");
  await loadScript(CDN + "pdf.js/3.11.174/pdf.worker.min.js");
  const pdf = await window.pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise, pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent(); let text = "", lastY = null;
    for (const it of tc.items) { const y = it.transform ? Math.round(it.transform[5]) : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && !text.endsWith("\n")) text += "\n";
      text += it.str; if (it.hasEOL) text += "\n"; if (y !== null) lastY = y; }
    pages.push({ number: i, text: text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim() });
    if (onp && i % 10 === 0) onp(`${i}/${pdf.numPages}쪽`);
  }
  return pages;
}

function analyze(pkg) {
  const live = pkg.docs.filter(d => d.pages && d.status === "done");
  pkg.built = E.buildPackage(live);
  pkg.policy = live.length ? E.policyOf(pkg.built) : {};
  pkg.items = live.length ? E.analyzePackage(pkg.built, pkg.policy) : [];
  pkg.refs = live.length ? E.crossRefs(pkg.built) : [];
  pkg.mix = live.length > 1 ? E.mixWarning(pkg.built) : "";
  pkg.drafts = E.drafts(pkg.items, pkg.refs, pkg.policy);
  pkg.claude = null; pkg.claudeDrafts = null; pkg.reqs = null; // 문서가 바뀌면 Claude 결과·다듬은 문장은 옛것이 되므로 버린다
}

async function addFiles(files, intoPkg) {
  const all = [...files], ok = all.filter(f => /\.(pdf|docx|txt|md)$/i.test(f.name));
  if (!ok.length) return toast("PDF, DOCX, TXT 파일만 읽을 수 있습니다.");
  if (ok.length < all.length) toast(`${all.length - ok.length}개 파일은 형식이 맞지 않아 건너뜁니다.`);
  clearToast();
  const pkg = intoPkg || newPkg(ok.length === 1 ? ok[0].name.replace(/\.[^.]+$/, "") : `새 입찰 건 ${st.pkgs.length + 1}`);
  st.cur = pkg.id;
  const recs = ok.map(f => { const d = { id: pkg.id + "d" + (++seq), name: f.name, file: f, status: "reading", msg: "읽는 중" }; pkg.docs.push(d); return d; });
  go(pkg.items.length ? st.tab : "docs");
  for (const d of recs) {
    try {
      const buf = await d.file.arrayBuffer(), ext = d.file.name.split(".").pop().toLowerCase();
      d.pages = ext === "pdf" ? await readPdf(buf, m => { d.msg = m; renderTab(); }) : ext === "docx" ? await readDocx(buf) : await readTxt(buf);
      d.kind = ext === "pdf" ? "pdf" : "docx";
      if (!d.pages.some(p => p.text.trim())) throw new Error("글자를 읽지 못했습니다. 스캔 이미지 PDF는 OCR을 먼저 거쳐야 합니다.");
      d.status = "done";
    } catch (e) { d.status = "error"; d.msg = e.message || String(e); }
    delete d.file; renderAll();
  }
  analyze(pkg);
  const n = recs.filter(d => d.status === "done").length;
  if (n) toast(`문서 ${n}권을 분석했습니다.`);
  renderAll();
}

// 원화는 경영진이 읽는 단위(조·억·만)로

  if (n >= 1e8) n = Math.round(n / 1e4) * 1e4;

  if (jo) parts.push(`${jo.toLocaleString("ko-KR")}조`); if (eok) parts.push(`${eok.toLocaleString("ko-KR")}억`); if (man) parts.push(`${man.toLocaleString("ko-KR")}만`); if (won) parts.push(won.toLocaleString("ko-KR"));

const money = (n, c) => n == null ? "-" : c === "KRW" ? korUnit(n) : `${c} ${Math.round(n).toLocaleString("en-US")}`;
const mrange = (r, c) => r.lo == null ? (r.fixed ? esc(r.fixed) : "-") : r.lo === r.hi ? money(r.lo, c) : `${money(r.lo, c)} ~<br>${money(r.hi, c)}`;
// "5억", "1조 2천억", "500,000,000", "500M", "1.2bn" → 숫자
// "5억", "5백억", "1조 2천억", "500,000,000", "500k", "1.2bn", "12 million 500 thousand" → 숫자. 못 읽으면 NaN.
function parseAmount(t) {
  t = String(t || "").replace(/,/g, "").replace(/(?:USD|EUR|KRW|GBP|JPY|SAR|AED|US\$|[$€₩£¥]|원)/gi, " ").trim();

  if (/[조억만천백십]/.test(t)) {
    // 큰 단위(조·억·만)까지를 한 묶음으로 보고, 묶음 안의 천·백·십을 먼저 더한 뒤 큰 단위를 곱한다: 3천5백억 = (3000+500)×1억

    lines.push(`- ${it.key} (${it.label}) 규칙 엔진: ${it.undetermined ? `모순(값 미정): ${it.conflict.values.map(v => v.value + "@" + v.docName).join(" / ")}` : it.found ? `"${it.value}" @ ${it.docName} p.${it.pages[0]}` : "못 찾음"}${it.conflict && it.conflict.status === "addendum" ? " [추가 공고 반영]" : ""} → 발췌 ${[...new Set(ids)].slice(0, 8).join(",")}`);
  }

- 우선순위: 추가 공고('바꾼다'는 문장만) > 입찰 절차 항목은 입찰지침·BDS, 계약 항목은 계약서 > 계약 데이터(CD) > 특수조건(PCC) > 일반조건(GCC) > 발주처 요구사항(ER) > 기술 시방(TS) > 부록.

<items>
${lines.join("\n")}

<chunks>

async function claudeExtract(p) {

    const merged = p.items.map(r => { const x = by.get(r.key); if (!x) return r;
      const risk = RISK[x.risk] ? x.risk : "unknown";
      if (r.undetermined) return { ...r, summary: String(x.summary || ""), risk: SEVN[risk] > SEVN[r.risk] ? risk : r.risk, risk_reason: r.risk_reason, source: "claude" }; // 모순은 규칙 대조 결과 유지
      const d = p.docs.find(dd => dd.status === "done" && x.doc && (dd.name === x.doc || dd.name.includes(String(x.doc))));
      const page = Number(x.page) > 0 ? Number(x.page) : r.pages[0], docId = d ? d.id : r.docId;
      const cand = r.candidates.find(cc => cc.docId === docId && cc.page === page), bd = p.built.docs.find(x => x.id === docId);
      // Claude가 규칙 엔진보다 낮게 판정하면 높은 쪽을 유지하고 두 판정을 함께 보여 준다(사람 확인)
      const lower = SEVN[risk] < SEVN[r.risk];
      return { ...r, found: !!x.found, value: String(x.value || ""), summary: String(x.summary || ""), evidence: String(x.evidence || r.evidence),
        docId, docName: d ? d.name : r.docName, docType: d ? d.type : r.docType, pages: page ? [page] : r.pages, clause: cand ? cand.clause : (docId === r.docId && page === r.pages[0] ? r.clause : bd && bd.type === "ADD" ? `Addendum No. ${bd.addNo}` : ""),
        risk: lower ? r.risk : risk, risk_reason: lower ? `${r.risk_reason} (Claude는 '${RISK[risk]}'로 판정: ${String(x.risk_reason || "")} · 두 판정이 달라 사람이 확인해야 합니다)` : String(x.risk_reason || ""), source: "claude", rule_value: r.value }; });
    p.claude = { overall: String(data.overall_summary || ""), top: (data.top_risks || []).map(String), items: merged };
    p.drafts = E.drafts(merged, p.refs, p.policy); p.claudeDrafts = null; // 판정이 바뀌었으니 초안도 다시 만든다
    toast("Claude 분석을 반영했습니다. 모순은 규칙 엔진 대조 결과를 유지합니다.");
  } catch (e) { if (e.code !== "cancelled") toast(errCopy(e)); failClaude(e); }
  st.busy = null; renderAll();
}
async function claudePolish(p) {
  if (!st.sample || st.busy) return;
  const base = p.drafts, ctl = new AbortController(); st.busy = { kind: "polish", ctl }; renderTab();
  try {
    const list = [...base.Q, ...base.D].map(x => ({ id: x.id, label: x.label, basis: x.basis, where: x.where, en: x.en, ko: x.ko }));
    const data = await st.sample.json(`당신은 국제 EPC 입찰의 계약 담당자입니다. 아래 질의(Q)·이탈(D) 초안의 제출 문안(en)을 발주처에 보내는 공식 문체로 다듬으세요(문안이 한국어면 한국어 공문체로). 조항·쪽 번호·수치는 바꾸지 말고, 사실을 더하지 마세요. 한국어 요약(ko)도 자연스럽게 다듬으세요.
반드시 JSON 배열 하나만: [{"id":"Q-01","en":"...","ko":"..."}]
초안:
${JSON.stringify(list, null, 1)}`, { signal: ctl.signal });
    if (!Array.isArray(data)) throw { code: "invalid_json" };
    const by = new Map(data.filter(x => x && x.id).map(x => [x.id, x]));
    const m = x => { const y = by.get(x.id); return y ? { ...x, en: String(y.en || x.en), ko: String(y.ko || x.ko) } : x; };
    p.claudeDrafts = { Q: base.Q.map(m), D: base.D.map(m), policy: base.policy };
    toast("Claude가 다듬은 문장으로 바꿨습니다.");
  } catch (e) { if (e.code !== "cancelled") toast(errCopy(e)); failClaude(e); }
  st.busy = null; renderAll();
}
const CHAT_RULES = `당신은 입찰안내서(ITB) 검토 어시스턴트입니다. 사용자는 건설사 입찰 담당자입니다. 입찰 건은 여러 문서(권)로 되어 있습니다.
문서 내용은 반드시 도구(search_document, read_pages, get_summary)로 직접 찾아 읽고 답하세요. 지어내지 마세요.
- 동의어(영문/한글)로 여러 번 검색해도 됩니다. 조항이 다른 문서를 참조하면 그 문서도 확인하세요.
- 같은 항목이 문서마다 다르면 둘 다 밝히고, 우선순위(추가 공고 > 입찰 절차는 입찰지침 / 계약 항목은 계약 데이터 > 특수조건 > 일반조건 > 요구사항 > 시방)와 질의 필요 여부를 쓰세요.
- 한국어로, 결론 먼저. 사실마다 [파일명 p.12] 형식으로 출처를 붙이세요.
- 찾지 못한 내용은 "문서에서 확인되지 않음"이라고 쓰세요.`;
function chatTools(p) {
  const docs = p.built.docs, pick = v => { const s = String(v || ""); return docs.find(d => d.name === s) || docs.find(d => d.name.includes(s) || s.includes(d.name.replace(/\.[^.]+$/, ""))) || docs[Number(s) - 1]; };
  const prog = s => { if (st.busy && st.busy.trace) { st.busy.trace.push(s); if (st.tab === "ask") paintLastMsg(p); } };
  return [
    { name: "search_document", description: "입찰 문서 묶음 전체를 키워드로 검색해 관련 발췌를 파일명·쪽 번호와 함께 돌려줍니다. 한글·영문 모두 가능.",
      inputSchema: { type: "object", properties: { query: { type: "string" }, top_k: { type: "integer", description: "1~8" } }, required: ["query"] },
      execute: inp => { const q = String(inp.query || ""); prog(`🔎 "${q}" 검색`); const k = Math.max(1, Math.min(Number(inp.top_k) || 5, 8));
        const hits = docs.flatMap(d => d.index.search(E.expandQuery(q), k).map(h => ({ d, ...h }))).sort((a, b) => b.score - a.score).slice(0, k);
        return hits.length ? hits.map(h => `<result doc="${h.d.name}" type="${typeLabel(h.d.type)}" page="${h.chunk.page}">\n${h.chunk.text}\n</result>`).join("\n") : "검색 결과가 없습니다. 동의어로 다시 검색하세요."; } },
    { name: "read_pages", description: "문서 하나의 지정한 쪽 범위 전문을 읽습니다. doc은 파일명(또는 문서 번호 1부터), 한 번에 최대 3쪽.",
      inputSchema: { type: "object", properties: { doc: { type: "string" }, start_page: { type: "integer" }, end_page: { type: "integer" } }, required: ["doc", "start_page"] },
      execute: inp => { const d = pick(inp.doc); if (!d) throw new Error("문서를 찾지 못했습니다. 파일명: " + docs.map(x => x.name).join(", "));
        const n = d.pages.length, a = Math.max(1, Number(inp.start_page) || 1), b = Math.min(Number(inp.end_page) || a, a + 2, n); if (a > n) throw new Error(`${d.name}은 ${n}쪽까지 있습니다.`);
        prog(`📄 ${shortDoc(d)} p.${a}${b > a ? "–" + b : ""}`); return d.pages.slice(a - 1, b).map(x => `<page doc="${d.name}" number="${x.number}">\n${x.text.slice(0, 9000)}\n</page>`).join("\n"); } },
    { name: "get_summary", description: "이미 만든 입찰 요약표(항목·적용 값·출처·판정·모순 여부)와 질의·이탈 초안 목록을 돌려줍니다.",
      execute: () => { prog("📋 요약표 참조"); return { items: items(p).map(i => ({ label: i.label, value: valTxt(i), doc: i.docName, page: i.pages[0], risk: i.risk, conflict: i.conflict ? { status: i.conflict.status, values: i.conflict.values.map(v => v.value + " @ " + v.docName) } : null })), drafts: [...drafts(p).Q, ...drafts(p).D].map(x => x.id + " " + x.label) }; } },
  ];
}
// Claude 없이: 분석 결과로 답할 수 있는 질문은 그 결과로, 나머지는 핵심 문장 발췌로
function offline(p, q) {
  const its = items(p), row = i => ({ docId: i.docId, page: i.pages[0], key: i.key, section: i.label, text: `${valTxt(i)} · ${RISK[i.risk]}${i.risk_reason ? " · " + i.risk_reason : ""}` });
  const pick = (title, list) => ({ content: title, passages: list.map(row), answered: true });
  if (/다른\s*값|모순|불일치|어느\s*쪽|conflict|discrepan/i.test(q)) {
    const o = its.filter(i => i.undetermined), a = its.filter(i => i.conflict && i.conflict.status === "addendum");
    return { content: o.length || a.length ? `문서끼리 값이 다른 항목입니다.\n${o.map(i => `• ${i.label}: ${i.conflict.values.map(v => `${typeLabel(v.type)} ${v.value}`).join(" vs ")} → 값 미정, 질의 필요`).join("\n")}${a.length ? `\n${a.map(i => `• ${i.label}: 추가 공고로 ${i.value} 적용`).join("\n")}` : ""}` : "문서끼리 값이 다른 항목이 없습니다.",
      passages: o.flatMap(i => i.conflict.values.map(v => ({ docId: v.docId, page: v.page, key: i.key, section: `${i.label} · ${typeLabel(v.type)}`, text: (i.candidates.find(c => c.docId === v.docId) || {}).evidence || v.value }))), answered: true };
  }
  if (/불리|리스크|위험|top|risk/i.test(q)) return pick("판정이 높음·주의인 항목입니다(높음 먼저).", its.filter(i => i.risk === "high" || i.risk === "medium" || i.undetermined).sort((a, b) => (a.risk === "high" ? 0 : 1) - (b.risk === "high" ? 0 : 1)).slice(0, 8).filter(i => i.found));
  if (/일정|마감|설명회|schedule|deadline/i.test(q)) return pick("입찰 일정입니다.", its.filter(i => i.group === "일정" && i.found));
  if (/보증|bond|security|guarantee/i.test(q)) return pick("보증·지급 관련 항목입니다.", its.filter(i => ["bid_bond", "performance_bond", "advance_payment", "retention"].includes(i.key) && i.found));
  if (/지체|delay|liquidated/i.test(q)) return pick("지체상금 관련 항목입니다.", its.filter(i => ["liquidated_damages", "ld_cap", "completion_period"].includes(i.key) && i.found));
  const ps = p.built.docs.flatMap(d => E.offlineAnswer(d.index, q).map(x => ({ ...x, docId: d.id, s: (d.index.search(E.expandQuery(q), 1)[0] || {}).score || 0 }))).sort((a, b) => b.s - a.s).slice(0, 5);
  return { content: "관련 조항의 핵심 문장입니다.", passages: ps };
}
function paintLastMsg(p) { const box = $("#msgs"); if (!box || !box.lastElementChild) return; box.lastElementChild.outerHTML = msgHtml(p, p.chat[p.chat.length - 1]); bindCommon(box); box.scrollTop = box.scrollHeight; }
async function ask(p, q) {
  if (st.busy) return;
  p.chat.push({ role: "user", content: q });
  if (!st.sample) { const o = offline(p, q); p.chat.push({ role: "assistant", ...o, offline: true }); renderTab(); return; }
  const ctl = new AbortController(), msg = { role: "assistant", content: "", pending: true, trace: [] };
  p.chat.push(msg); st.busy = { kind: "chat", ctl, trace: msg.trace }; renderTab();
  const turns = p.chat.filter(m => !m.pending && m.content && !m.offline).slice(-7, -1).map(m => ({ role: m.role, content: m.content }));
  const head = `${CHAT_RULES}\n\n[입찰 건: ${p.name}] 문서: ${p.built.docs.map((d, i) => `${i + 1}) ${d.name}(${typeLabel(d.type)}, ${d.pages.length}쪽)`).join(", ")}`;
  let input;
  if (st.tools) input = [{ role: "user", content: head }, ...turns, { role: "user", content: q }];
  else { const ctx = p.built.docs.flatMap(d => d.index.search(E.expandQuery(q), 3).map(h => ({ d, ...h }))).sort((a, b) => b.score - a.score).slice(0, 6).map(h => `<chunk doc="${h.d.name}" page="${h.chunk.page}">\n${h.chunk.text}\n</chunk>`).join("\n");
    input = [{ role: "user", content: head.replace(/문서 내용은 반드시 도구[^\n]+\n/, "아래 발췌만 근거로 답하세요.\n") }, ...turns, { role: "user", content: `<excerpts>\n${ctx}\n</excerpts>\n\n질문: ${q}` }]; }
  try {
    const opts = { signal: ctl.signal, onText: ({ text }) => { msg.content = text; if (st.tab === "ask") paintLastMsg(p); } };
    if (st.tools) opts.tools = chatTools(p); else opts.cache = false;
    const r = await st.sample(input, opts);
    msg.content = r.text + (r.truncated ? "\n\n(답이 길어 중간에 끊겼습니다. 질문을 좁혀 주세요.)" : "");
  } catch (e) {
    msg.content = e.code === "refused" ? "" : (e.text || "");
    if (e.code === "cancelled") msg.content += (msg.content ? "\n\n" : "") + "(중지함)";
    else { const o = offline(p, q); msg.content += (msg.content ? "\n\n" : "") + errCopy(e) + "\n" + o.content; msg.offline = true; msg.passages = o.passages; msg.answered = o.answered; }
    if (e.code === "tools_unavailable") st.tools = false; failClaude(e);
  }
  msg.pending = false; st.busy = null; renderAll();
}

// ── 내보내기 ─────────────────────────────────────
function summaryRows(p) {
  return [["묶음", "항목", "적용 값", "판정", "판정 이유", "모순", "출처 문서", "쪽", "근거 조항", "담당", "근거 원문", "문서별 값", "검토 완료"],
    ...items(p).map(i => [i.group, i.label, valTxt(i), RISK[i.risk], i.risk_reason, i.undetermined ? "모순(값 미정)" : i.conflict ? "추가 공고 반영" : "", i.undetermined ? "" : i.docName, i.undetermined ? "" : i.pages.join(","), i.clause || "", i.dept, i.undetermined ? "" : i.evidence,
      i.candidates.map(c => `${c.value} @ ${c.docName} p.${c.page}`).join(" / "), review(p)[i.key] ? "예" : ""])];
}
function allDrafts(p) { const d = drafts(p); return [...d.Q, ...d.D, ...techDrafts(p)]; }
const KIND = x => x.id[0] === "Q" ? "질의" : x.id[0] === "D" ? "이탈" : "기술 후보";
function draftRows(p) { return [["번호", "구분", "항목", "근거", "출처", "담당", "한국어 요약", "제출 문안"], ...allDrafts(p).map(x => [x.id, KIND(x), x.label, x.basis, x.where, x.owner, x.ko, x.en])]; }
const hasTBD = arr => arr.some(x => /\[TBD/.test(x.en));
async function saveCsv(p, which) {
  const rows = which === "drafts" ? draftRows(p) : summaryRows(p);
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  try { await st.downloads.save({ filename: `${p.name.replace(/[\\/:*?"<>|]/g, "_")}_${which === "drafts" ? "질의이탈" : "입찰요약표"}.csv`, data: csv }); toast("CSV를 저장했습니다."); }
  catch (e) { if (e.code !== "declined") toast("저장하지 못했습니다. '복사'로 엑셀에 붙여 넣어 주세요."); }
}
const copyRows = rows => copyText(rows.map(r => r.map(v => String(v ?? "").replace(/[\t\n]+/g, " ")).join("\t")).join("\n"), "표를 복사했습니다. 엑셀에 붙여 넣으세요.");
async function copyText(t, ok) { try { await navigator.clipboard.writeText(t); toast(ok); } catch { toast("복사가 막혀 있습니다. 내용을 직접 선택해 복사해 주세요."); } }
function clearToast() { const t = $("#toast"); if (t) t.hidden = true; }
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3600); }

$("#file").onchange = e => { if (e.target.files.length) addFiles(e.target.files, st.pickInto); e.target.value = ""; };
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files, cur()); });

// ── 시작: 가상 샘플 입찰 건 2개 ─────────────────────
const SAMPLES = JSON.parse($("#samples").textContent);
const first = addSamplePkg(SAMPLES.bundle); addSamplePkg(SAMPLES.ko);
st.cur = first.id; st.tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "summary";
renderAll();
(async () => {
  const c = window.claude; if (!c || !c.use) return;
  const [sample, downloads] = await Promise.all([c.use("sample").catch(() => null), c.use("downloads").catch(() => null)]);

  if (sample) { st.sample = sample; const lim = await sample.limits().catch(() => null); st.tools = !!(lim && lim.tools); }

})();
