<title>ITB Reviewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위 표제란(입찰 건·문서 묶음) + 탭, 아래 단일 열 작업면(최대 1280px). 도면 대장처럼 차분한 청록·회색.
   토큰: 색 bg·panel·sunk·ink·muted·line·accent + 의미색 high/med/low/none + 모순 conflict, 추가 공고 add + 형광 hl-1~5(요약표 묶음별).
   글꼴: IBM Plex Sans KR(제목·본문), IBM Plex Mono(값·쪽 번호·문서 번호). */
:root{
  --bg:#f2f5f5; --panel:#ffffff; --sunk:#e8eeed; --ink:#13201f; --muted:#556664; --faint:#7d8d8b; --line:#d6dfdd; --line-2:#e6ecea;
  --accent:#0c6a65; --accent-ink:#ffffff; --accent-soft:#ddeeec;
  --high:#b42318; --high-bg:#fdeceb; --med:#975a00; --med-bg:#fff1d9; --low:#1d7744; --low-bg:#e3f3e8; --none:#5e6e6c; --none-bg:#e8edec;
  --conflict:#b04a06; --conflict-bg:#fde9d4; --add:#3b5bb5; --add-bg:#e5ebfa;
  --hl-1:#ffe36b; --hl-2:#b5d8ff; --hl-3:#aeeec4; --hl-4:#ffc9a8; --hl-5:#e2d2ff; --hl-ink:#13201f;
  --shadow:0 1px 2px rgb(19 32 31 / .06),0 6px 18px rgb(19 32 31 / .06);
  --f-sans:"IBM Plex Sans KR","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --panel:#141f1e; --sunk:#1a2827; --ink:#e3ebe9; --muted:#9db0ad; --faint:#728683; --line:#2a3a38; --line-2:#20302e;
  --accent:#5fc4ba; --accent-ink:#081312; --accent-soft:#163331;
  --high:#ff8f84; --high-bg:#3a1c19; --med:#f2bd69; --med-bg:#352712; --low:#7fd39d; --low-bg:#15301f; --none:#9db0ad; --none-bg:#1f2c2b;
  --conflict:#f4a457; --conflict-bg:#3a240e; --add:#9db4ff; --add-bg:#1c2546;
  --hl-1:#5c4b10; --hl-2:#1e4168; --hl-3:#1d4a31; --hl-4:#5a3218; --hl-5:#40306a; --hl-ink:#f3f6f5;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --panel:#141f1e; --sunk:#1a2827; --ink:#e3ebe9; --muted:#9db0ad; --faint:#728683; --line:#2a3a38; --line-2:#20302e;
  --accent:#5fc4ba; --accent-ink:#081312; --accent-soft:#163331;
  --high:#ff8f84; --high-bg:#3a1c19; --med:#f2bd69; --med-bg:#352712; --low:#7fd39d; --low-bg:#15301f; --none:#9db0ad; --none-bg:#1f2c2b;
  --conflict:#f4a457; --conflict-bg:#3a240e; --add:#9db4ff; --add-bg:#1c2546;
  --hl-1:#5c4b10; --hl-2:#1e4168; --hl-3:#1d4a31; --hl-4:#5a3218; --hl-5:#40306a; --hl-ink:#f3f6f5;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14.5px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
h1,h2,h3{margin:0;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.grow{flex:1}
/* header */
.top{background:var(--panel)}
.top .wrap{padding-block:12px 4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.brand h1{font-size:19px;font-weight:700}
.brand .sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--none-bg);color:var(--none);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pkgbar{background:var(--panel);border-bottom:1px solid var(--line-2)}
.pkgbar .wrap{padding-block:8px 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pkgsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pkgbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;max-width:100%;text-align:left}
.pkgbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.pkgbtn .t{display:block;font-size:11px;color:var(--muted);font-weight:400}
.dday{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--sunk)}
.dday.soon{background:var(--high-bg);color:var(--high)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs-wrap{position:relative}
.tabs-wrap::after{content:"";position:absolute;right:0;top:0;bottom:1px;width:28px;pointer-events:none;background:linear-gradient(to right,transparent,var(--panel))}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-right:24px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:flex;gap:6px;align-items:center;padding:9px 12px 10px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.tabs a .n{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.tabs a .c{font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tabs a .c.hot{background:var(--conflict-bg);color:var(--conflict)}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main.wrap{padding-block:18px 56px}
section[hidden]{display:none}
.sec-h{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:4px}
.sec-h h2{font-size:21px}
.lede{color:var(--muted);max-width:820px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.h3{font-size:16px;font-weight:700;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);padding:3px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
.r-high{color:var(--high);background:var(--high-bg)} .r-medium{color:var(--med);background:var(--med-bg)} .r-low{color:var(--low);background:var(--low-bg)} .r-none,.r-unknown{color:var(--none);background:var(--none-bg)}
.f-open{color:var(--conflict);background:var(--conflict-bg)} .f-add{color:var(--add);background:var(--add-bg)} .f-miss{color:var(--conflict);background:transparent;border-style:dashed}
.docref{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.docref:focus-visible{outline:2px solid var(--accent)}
.tscroll{overflow-x:auto;max-width:100%}
/* key strip */
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
@media (max-width:980px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.keys{grid-template-columns:repeat(2,minmax(0,1fr))}}
.keys>div{padding:10px 14px;border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);margin:-1px 0 0 -1px}
.keys .k{font-size:12px;color:var(--muted)}
.keys .v{font-family:var(--f-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.keys .n{font-size:11.5px;color:var(--faint)}
.v.high{color:var(--high)} .v.conflict{color:var(--conflict)}
.verdict{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:880px){.verdict{grid-template-columns:minmax(0,1fr)}}
.toplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.toplist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.exp table{width:100%;border-collapse:collapse;font-size:13px}
.exp th,.exp td{padding:5px 6px;border-bottom:1px solid var(--line-2);text-align:left}
.exp td.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.priceinp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;min-width:0;width:200px;max-width:100%;font-family:var(--f-mono)}
/* summary table */
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
table.t th,table.t td{padding:8px 9px;border-bottom:1px solid var(--line-2);vertical-align:top;text-align:left}
table.t thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap;border-bottom:1px solid var(--line)}
tr.grp td{background:var(--sunk);font-weight:700;font-size:12.5px;color:var(--muted);padding:5px 9px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--bg)}
tr.row.done td{background:color-mix(in srgb,var(--low-bg) 55%,transparent)}
td.lab{font-weight:600;white-space:nowrap}
td.lab .car{display:inline-block;width:12px;color:var(--faint);font-weight:400}
td.val{font-family:var(--f-mono);font-size:13px;max-width:420px}
td.val .s{font-family:var(--f-sans);font-size:12px;color:var(--muted);margin-top:2px}
.miss{font-family:var(--f-sans);color:var(--muted);font-style:italic}
td.flags{display:flex;flex-wrap:wrap;gap:4px}
td.ck{text-align:center}
td.ck input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
tr.det td{background:var(--bg);font-size:13px}
.quote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0;max-width:95ch}
.cands{display:grid;gap:4px;margin-top:6px}
.cand{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12.5px}
.cand .vv{font-family:var(--f-mono);font-weight:600}
.cand.applied .vv{color:var(--accent)}
.prog{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
/* issues / drafts */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.grid>*{min-width:0}
.icard{padding:12px 14px;border-left:4px solid var(--line)}
.icard.open{border-left-color:var(--conflict)} .icard.add{border-left-color:var(--add)} .icard.high{border-left-color:var(--high)} .icard.medium{border-left-color:var(--med)}
.icard h3{font-size:15px;margin:4px 0 6px}
.vs{display:grid;gap:4px;margin:6px 0}
.vs .row2{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px}
.vs .vv{font-family:var(--f-mono);font-weight:600}
.rule{font-size:12.5px;color:var(--muted)}
.draft{padding:12px 14px}
.draft .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:6px}
.draft .id{font-family:var(--f-mono);font-weight:600}
.draft .en{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border-radius:6px;padding:8px 10px;margin:6px 0;white-space:pre-wrap}
/* source */
.src-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1000px){.src-grid{grid-template-columns:minmax(0,1fr)}}
.srcbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;max-width:100%}
.paper{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px}
.paper .run{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);padding:8px 18px;border-bottom:1px solid var(--line-2)}
.paper pre{margin:0;padding:16px 18px;white-space:pre-wrap;font-family:var(--f-mono);font-size:12.8px;line-height:1.75;overflow-wrap:anywhere}
mark.hl{color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.g1{background:var(--hl-1)} mark.g2{background:var(--hl-2)} mark.g3{background:var(--hl-3)} mark.g4{background:var(--hl-4)} mark.g5{background:var(--hl-5)}
mark.hl.focus{outline:2px solid var(--ink);outline-offset:1px}
mark.hl sup{font-family:var(--f-sans);font-size:10px;font-weight:600;margin-left:2px;vertical-align:.5em}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:1000px){.side{position:static;max-height:none}}
.mlist{display:flex;flex-direction:column}
.mrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13px}
.mrow:hover,.mrow.on{background:var(--accent-soft)}
.mrow .vv{font-family:var(--f-mono);font-size:12.5px;grid-column:1/-1;color:var(--muted)}
/* teams */
.team h3{display:flex;gap:8px;align-items:baseline;font-size:15px}
.team ul{margin:6px 0 0;padding:0;list-style:none}
.team li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:13px;align-items:baseline}
.team li .vv{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);grid-column:1/-1}
/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;max-height:600px;overflow:auto;margin:10px 0}
.msg{padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-width:100%}
.msg.u{background:var(--accent-soft);align-self:flex-end;max-width:85%}
.msg.a{background:var(--bg);border:1px solid var(--line)}
.trace{font-size:12px;color:var(--muted);margin-top:6px;white-space:normal}
.psg{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);white-space:normal;font-size:13px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel)}
.spin{width:15px;height:15px;flex:none;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* guide */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.steps li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13.5px}
.steps .sn{font-family:var(--f-mono);font-weight:600;color:var(--accent);margin-right:6px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 22px}
.gloss div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.gloss b{font-family:var(--f-mono)}
abbr[title]{text-decoration:underline dotted var(--faint);text-underline-offset:3px;cursor:help}
/* uploads */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);background:var(--panel);cursor:pointer;display:block}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;color:var(--ink);font-size:15px}
.doclist{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));margin-top:8px}
.docrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px}
.docrow .nm{font-weight:600;word-break:break-all}
.docrow .mt{grid-column:1/-1;font-size:12px;color:var(--muted)}
.notice{border-left:3px solid var(--conflict);background:var(--conflict-bg);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90;max-width:calc(100% - 32px)}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}
@media (max-width:600px){body{font-size:14px}.sec-h h2{font-size:18px}.brand h1{font-size:17px}main.wrap{padding-block:14px 40px}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>ITB Reviewer</h1></div>
    <span class="sub muted small">입찰 문서 묶음에서 값을 뽑아 대조하고, 모순·리스크를 질의·이탈 초안과 부서별 할 일로 바꿉니다</span>
    <span class="grow"></span>
    <span id="engine" class="pill"><i></i><span>규칙 엔진</span></span>
  </div>
</header>
<div class="pkgbar"><div class="wrap" id="pkgbar"></div></div>
<div class="tabbar"><div class="wrap"><div class="tabs-wrap"><nav class="tabs" role="tablist" aria-label="화면" id="tabs"></nav></div></div></div>
<main class="wrap" id="main" aria-live="polite">
  <section id="p-summary" role="tabpanel" hidden></section>
  <section id="p-issues" role="tabpanel" hidden></section>
  <section id="p-drafts" role="tabpanel" hidden></section>
  <section id="p-source" role="tabpanel" hidden></section>
  <section id="p-teams" role="tabpanel" hidden></section>
  <section id="p-ask" role="tabpanel" hidden></section>
  <section id="p-docs" role="tabpanel" hidden></section>
  <section id="p-guide" role="tabpanel" hidden></section>
</main>
<input type="file" id="file" accept=".pdf,.docx,.txt,.md" multiple hidden>
<div class="toast" id="toast" role="status" hidden></div>

<script id="samples" type="application/json">__SAMPLES__</script>
<script>__ENGINE__</script>
<script>
(() => {
"use strict";
const E = window.ITBEngine;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RISK = { high: "높음", medium: "주의", low: "양호", none: "해당 없음", unknown: "확인 필요" };
const GCLS = { "일정": "g1", "상업 조건": "g2", "기술 조건": "g3", "제출 서류": "g4", "일반": "g5" };
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";
const TABS = [["summary", "입찰 요약표"], ["issues", "모순·리스크"], ["drafts", "질의·이탈 초안"], ["source", "원문 형광펜"], ["teams", "부서별 전달"], ["ask", "문서에 질문"], ["docs", "문서 묶음"], ["guide", "처음이라면"]];
const ABBR = { ITB: "Instructions to Bidders, 입찰지침", CD: "Contract Data, 계약 데이터", PCC: "Particular Conditions of Contract, 계약 특수조건", GCC: "General Conditions of Contract, 계약 일반조건", ER: "Employer's Requirements, 발주처 요구사항", TS: "Technical Specifications, 기술 시방", RUI: "Rely Upon Information, 계약자가 믿고 써도 되는 자료" };
const GLOSSARY = [["ITB", "Invitation/Instructions to Bidders. 발주처가 주는 입찰 문서 묶음 전체, 또는 그중 입찰 절차를 정한 권"], ["추가 공고", "Addendum. 입찰 중에 발주처가 문서를 고치는 공고. 앞선 판보다 우선"], ["CD", "Contract Data. 일반조건의 빈칸(비율·기간·금액)을 채운 표"], ["PCC", "Particular Conditions. 일반조건을 이 사업에 맞게 고친 특수조건"], ["GCC", "General Conditions. FIDIC 같은 표준 일반조건"], ["ER", "Employer's Requirements. 발주처가 원하는 성능·범위"], ["TS", "Technical Specifications. 기술 시방서"], ["우선순위", "문서끼리 값이 다를 때 어느 문서를 따를지 정한 조항(보통 PCC 1.5)"], ["질의", "Clarification. 마감 전에 모순·누락을 발주처에 묻는 공식 문서"], ["이탈", "Deviation. 입찰서에 '이 조건은 이렇게 바꿔 달라'고 적는 요청"], ["지체상금", "Delay damages(LD). 준공이 늦으면 하루·주마다 내는 돈"], ["DNP", "Defects Notification Period. 인수 뒤 하자를 고칠 책임 기간"], ["RUI", "Rely Upon Information. 계약자가 믿고 설계·가격에 써도 되는 조사 자료"], ["EPC", "설계·조달·시공 일괄 계약. 턴키라고도 함"], ["FIDIC", "국제 건설 계약 표준 조건을 만드는 단체. Silver Book은 EPC/턴키용"], ["Lump sum", "총액 고정 계약. 물량 변동 위험을 계약자가 짐"]];

const st = { pkgs: [], cur: null, tab: "summary", group: "전체", rf: "all", open: new Set(), src: { doc: null, page: 1, focus: null },
  sample: null, tools: false, downloads: null, busy: null };
let seq = 0;
const store = { get(k, d) { try { const v = localStorage.getItem("itbr:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("itbr:" + k, JSON.stringify(v)); } catch {} } };
const cur = () => st.pkgs.find(p => p.id === st.cur);

// ── 파일 읽기(브라우저 안에서만) ─────────────────────
const loaded = {};
function loadScript(src) {
  return loaded[src] ||= new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok;
    s.onerror = () => { delete loaded[src]; no(new Error("문서 해석 라이브러리를 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 올려 주세요.")); }; document.head.appendChild(s); });
}
async function readPdf(buf, onp) {
  await loadScript(CDN + "pdf.js/3.11.174/pdf.min.js");
  await loadScript(CDN + "pdf.js/3.11.174/pdf.worker.min.js");
  const pdf = await window.pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise, pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent(); let text = "", lastY = null;
    for (const it of tc.items) { const y = it.transform ? Math.round(it.transform[5]) : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2 && !text.endsWith("\n")) text += "\n";
      text += it.str; if (it.hasEOL) text += "\n"; if (y !== null) lastY = y; }
    pages.push({ number: i, text: text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim() });
    if (onp && i % 10 === 0) onp(`${i}/${pdf.numPages}쪽`);
  }
  return pages;
}
async function readDocx(buf) { await loadScript(CDN + "mammoth/1.6.0/mammoth.browser.min.js");
  const { value } = await window.mammoth.extractRawText({ arrayBuffer: buf }); return E.pseudoPages(value.split(/\n+/).map(s => s.trim()).filter(Boolean)); }
async function readTxt(buf) { let t; try { t = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { t = new TextDecoder("euc-kr").decode(buf); }
  return E.pseudoPages(t.split(/\n\s*\n/).filter(b => b.trim())); }

// ── 입찰 건(패키지) ───────────────────────────────
function analyze(pkg) {
  const live = pkg.docs.filter(d => d.pages && d.status === "done");
  pkg.built = E.buildPackage(live);
  pkg.items = live.length ? E.analyzePackage(pkg.built) : [];
  pkg.refs = live.length ? E.crossRefs(pkg.built) : [];
  pkg.drafts = E.drafts(pkg.items, pkg.refs);
  pkg.claude = null;
}
function newPkg(name, sample) { const p = { id: "p" + (++seq), name, sample: !!sample, docs: [], chat: [], items: [], refs: [], drafts: { Q: [], D: [] } }; st.pkgs.push(p); return p; }
function addSamplePkg(s) {
  const p = newPkg(s.name, true);
  p.docs = s.docs.map((d, i) => ({ id: p.id + "d" + (i + 1), name: d.name, kind: d.kind, pages: d.pages, status: "done", type: d.type }));
  analyze(p); return p;
}
async function addFiles(files, intoPkg) {
  const ok = [...files].filter(f => /\.(pdf|docx|txt|md)$/i.test(f.name));
  if (!ok.length) return toast("PDF, DOCX, TXT 파일만 읽을 수 있습니다.");
  if (ok.length < files.length) toast(`${files.length - ok.length}개 파일은 형식이 맞지 않아 건너뜁니다.`);
  const pkg = intoPkg || newPkg(ok.length === 1 ? ok[0].name.replace(/\.[^.]+$/, "") : `새 입찰 건 ${seq}`);
  st.cur = pkg.id;
  const recs = ok.map(f => { const d = { id: pkg.id + "d" + (pkg.docs.length + 1) + "_" + (++seq), name: f.name, file: f, status: "reading", msg: "읽는 중" }; pkg.docs.push(d); return d; });
  go(pkg.items.length ? st.tab : "docs");
  for (const d of recs) {
    try {
      const buf = await d.file.arrayBuffer(), ext = d.file.name.split(".").pop().toLowerCase();
      d.pages = ext === "pdf" ? await readPdf(buf, m => { d.msg = m; renderAll(); }) : ext === "docx" ? await readDocx(buf) : await readTxt(buf);
      d.kind = ext === "pdf" ? "pdf" : "docx";
      if (!d.pages.some(p => p.text.trim())) throw new Error("글자를 읽지 못했습니다. 스캔 이미지 PDF는 OCR을 먼저 거쳐야 합니다.");
      d.status = "done";
    } catch (e) { d.status = "error"; d.msg = e.message || String(e); }
    delete d.file; renderAll();
  }
  analyze(pkg);
  if (pkg.items.length) toast(`${recs.filter(d => d.status === "done").length}개 문서를 분석했습니다.`);
  renderAll();
}

// ── 파생 값 ──────────────────────────────────────
const items = p => (p.claude ? p.claude.items : p.items);
const reviewKey = p => "review:" + p.name;
function review(p) { return store.get(reviewKey(p), {}); }
function setReview(p, key, on) { const r = review(p); if (on) r[key] = 1; else delete r[key]; store.set(reviewKey(p), r); }
function dday(p) {
  const it = p.items.find(i => i.key === "bid_due_date"); if (!it || !it.found) return null;
  const iso = E.isoDate(it.value); if (!iso) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(iso + "T00:00:00");
  return { iso, n: Math.round((due - today) / 864e5), item: it };
}
function counts(p) {
  const its = items(p);
  return { high: its.filter(i => i.risk === "high").length, medium: its.filter(i => i.risk === "medium").length,
    open: its.filter(i => i.conflict && i.conflict.status === "open").length, added: its.filter(i => i.conflict && i.conflict.status === "addendum").length,
    missRefs: p.refs.filter(r => !r.present).length, q: p.drafts.Q.length, d: p.drafts.D.length, found: its.filter(i => i.found).length, total: its.length,
    reviewed: Object.keys(review(p)).filter(k => its.some(i => i.key === k)).length };
}
const typeLabel = c => (E.TYPE[c] || E.TYPE.ETC).label;
const docOf = (p, id) => p.docs.find(d => d.id === id);
function refBtn(p, docId, page, hl, label) {
  const d = docOf(p, docId); if (!d || !page) return "";
  return `<button class="docref" data-doc="${esc(docId)}" data-page="${page}" data-hl="${esc(hl || "")}" title="${esc(d.name)} ${page}쪽 원문 보기">${esc(label || shortDoc(d))} p.${page}</button>`;
}
const shortDoc = d => d.name.replace(/\.[^.]+$/, "").replace(/_/g, " ").slice(0, 28);
function flagsOf(it) {
  const f = [`<span class="flag r-${it.risk}">${RISK[it.risk]}</span>`];
  if (it.conflict && it.conflict.status === "open") f.push(`<span class="flag f-open" title="문서마다 값이 다릅니다">모순</span>`);
  if (it.conflict && it.conflict.status === "addendum") f.push(`<span class="flag f-add" title="추가 공고가 값을 바꿨습니다">추가 공고 반영</span>`);
  if (!it.found) f.push(`<span class="flag f-miss">조항 없음</span>`);
  return f.join("");
}
const won = n => n == null ? "-" : "USD " + n.toLocaleString("en-US");

// ── 렌더 ─────────────────────────────────────────
function renderAll() { paintEngine(); renderPkgbar(); renderTabs(); renderTab(); }
function paintEngine() { const el = $("#engine"); el.className = "pill" + (st.sample ? " on" : ""); el.lastChild.textContent = st.sample ? "Claude 연결됨" : "규칙 엔진"; el.title = st.sample ? "Claude 정밀 분석·질문을 쓸 수 있습니다(보는 사람의 Claude 사용량 사용)" : "claude.ai에서 열면 Claude 기능이 켜집니다"; }
function renderPkgbar() {
  const p = cur(), dd = p && dday(p);
  $("#pkgbar").innerHTML = `
    <div class="pkgsel" role="group" aria-label="입찰 건">${st.pkgs.map(x => `<button class="pkgbtn" data-pkg="${x.id}" aria-current="${x.id === st.cur}">${esc(x.name)}<span class="t">${x.sample ? "가상 샘플 · " : ""}문서 ${x.docs.length}권</span></button>`).join("")}</div>
    <span class="grow"></span>
    ${dd ? `<span class="dday ${dd.n <= 14 ? "soon" : ""}" title="입찰 마감 ${esc(dd.item.value)}">${dd.n >= 0 ? `마감 D-${dd.n}` : `마감 ${-dd.n}일 지남`} · ${dd.iso}</span>` : ""}
    <button class="btn" id="b-add" ${p ? "" : "disabled"}>이 건에 문서 추가</button>
    <button class="btn primary" id="b-new">새 입찰 건 올리기</button>`;
  $$(".pkgbtn").forEach(b => b.onclick = () => { st.cur = b.dataset.pkg; st.open = new Set(); st.src = { doc: null, page: 1, focus: null }; renderAll(); });
  $("#b-new").onclick = () => { st.pickInto = null; $("#file").click(); };
  $("#b-add").onclick = () => { st.pickInto = cur(); $("#file").click(); };
}
function renderTabs() {
  const p = cur(), c = p ? counts(p) : null;
  const badge = { issues: c ? c.open + c.missRefs : 0, drafts: c ? c.q + c.d : 0 };
  $("#tabs").innerHTML = TABS.map(([id, label], i) => `<a href="#${id}" role="tab" id="t-${id}" aria-controls="p-${id}" aria-selected="${st.tab === id}"><span class="n">${String(i + 1).padStart(2, "0")}</span>${label}${badge[id] ? `<span class="c ${id === "issues" && c.open ? "hot" : ""}">${badge[id]}</span>` : ""}</a>`).join("");
  TABS.forEach(([id]) => { const s = $("#p-" + id); s.hidden = id !== st.tab; s.setAttribute("aria-labelledby", "t-" + id); });
}
function go(tab, scroll = true) { if (!TABS.some(t => t[0] === tab)) tab = "summary"; st.tab = tab; if (location.hash.slice(1) !== tab) history.replaceState(null, "", "#" + tab); renderTabs(); renderTab(); if (scroll) window.scrollTo({ top: 0 }); }
window.addEventListener("hashchange", () => go(location.hash.slice(1) || "summary"));
function renderTab() {
  const p = cur(), el = $("#p-" + st.tab);
  if (!p) { el.innerHTML = `<div class="card pad">입찰 문서를 올려 주세요.</div>`; return; }
  const busy = p.docs.filter(d => d.status === "reading");
  const wait = busy.length ? `<div class="card pad small" style="margin-bottom:12px"><span class="spin"></span> 문서 ${busy.length}권을 읽는 중입니다. ${esc(busy[0].name)} ${esc(busy[0].msg || "")}</div>` : "";
  const fn = { summary: vSummary, issues: vIssues, drafts: vDrafts, source: vSource, teams: vTeams, ask: vAsk, docs: vDocs, guide: vGuide }[st.tab];
  if (!p.items.length && !["docs", "guide"].includes(st.tab)) { el.innerHTML = wait + `<div class="card pad">아직 분석할 문서가 없습니다. <button class="btn sm" data-go="docs">문서 묶음으로</button></div>`; bindCommon(el); return; }
  el.innerHTML = wait + fn(p);
  bindCommon(el); (bind[st.tab] || (() => {}))(p, el);
}
function bindCommon(el) {
  $$("[data-go]", el).forEach(b => b.onclick = () => go(b.dataset.go));
  $$(".docref", el).forEach(b => b.onclick = e => { e.stopPropagation(); openSource(b.dataset.doc, +b.dataset.page, b.dataset.hl); });
}
const bind = {};

// 01 입찰 요약표
function vSummary(p) {
  const c = counts(p), its = items(p), rv = review(p), dd = dday(p), price = store.get("price:" + p.name, 0);
  const top = its.filter(i => i.risk === "high" || (i.conflict && i.conflict.status === "open")).sort((a, b) => (b.conflict && b.conflict.status === "open") - (a.conflict && a.conflict.status === "open"));
  const ex = E.exposure(its, price);
  const vis = its.filter(i => (st.group === "전체" || i.group === st.group) && (st.rf === "all" || (st.rf === "flag" ? (i.risk === "high" || i.risk === "medium" || i.conflict || !i.found) : st.rf === "todo" ? !rv[i.key] : true)));
  let rows = "";
  for (const g of E.GROUPS) {
    const gi = vis.filter(i => i.group === g); if (!gi.length) continue;
    rows += `<tr class="grp"><td colspan="6">${esc(g)} <span class="tiny">· ${gi.length}개</span></td></tr>`;
    for (const it of gi) {
      const o = st.open.has(it.key), done = !!rv[it.key];
      rows += `<tr class="row ${done ? "done" : ""}" data-k="${it.key}" tabindex="0" aria-expanded="${o}">
        <td class="lab"><span class="car">${o ? "▾" : "▸"}</span>${esc(it.label)}</td>
        <td class="val">${it.found ? esc(it.value) : '<span class="miss">문서에서 찾지 못함</span>'}${it.summary ? `<div class="s">${esc(it.summary)}</div>` : ""}</td>
        <td class="flags">${flagsOf(it)}</td>
        <td>${it.found ? refBtn(p, it.docId, it.pages[0], it.evidence.slice(0, 80)) : ""}</td>
        <td class="small">${esc(it.dept)}</td>
        <td class="ck"><input type="checkbox" data-rv="${it.key}" ${done ? "checked" : ""} aria-label="${esc(it.label)} 검토 완료"></td></tr>`;
      if (o) rows += `<tr class="det"><td colspan="6">
        ${it.risk_reason ? `<div><b>리스크 판단</b> · ${esc(it.risk_reason)}</div>` : ""}
        ${it.conflict ? `<div class="notice" style="margin:6px 0">${esc(it.conflict.rule)}</div>` : ""}
        ${it.evidence ? `<div class="quote">${esc(it.evidence)}</div>` : '<div class="muted">근거 문장 없음</div>'}
        ${it.candidates.length > 1 ? `<div class="cands"><b class="small">문서별 값</b>${it.candidates.map(cd => `<div class="cand ${cd.docId === it.docId ? "applied" : ""}"><span class="vv">${esc(cd.value)}</span><span class="tiny muted">${esc(typeLabel(cd.type))}</span>${refBtn(p, cd.docId, cd.page, cd.evidence.slice(0, 80))}${cd.docId === it.docId ? '<span class="tiny">← 적용</span>' : ""}</div>`).join("")}</div>` : ""}
        <div class="tiny muted" style="margin-top:6px">쓰임: ${esc(it.use)} · 담당 ${esc(it.dept)}${it.section ? ` · 조항 ${esc(it.section)}` : ""} · 추출 ${it.source === "claude" ? "Claude" : "규칙 엔진"}${it.rule_value !== undefined && it.rule_value !== it.value ? ` (규칙 엔진 값 ${esc(it.rule_value || "없음")})` : ""}</div></td></tr>`;
    }
  }
  const claudeBusy = st.busy && st.busy.kind === "extract";
  return `
  <div class="sec-h"><h2>입찰 요약표</h2><span class="muted small">${esc(p.name)} · 문서 ${p.docs.length}권 · ${p.claude ? "Claude 분석" : "규칙 엔진 추출"}</span></div>
  <p class="lede">문서 ${p.docs.length}권에서 ${c.total}개 항목을 찾아 문서끼리 대조했습니다. 값이 문서마다 다르면 자동으로 고르지 않고 <b>모순</b>으로 올립니다. 각 값의 쪽 번호를 누르면 원문에서 그 자리가 칠해져 보입니다.</p>
  <div class="stack">
  <div class="keys">
    <div><div class="k">입찰 마감</div><div class="v">${dd ? (dd.n >= 0 ? "D-" + dd.n : "지남") : "-"}</div><div class="n">${dd ? esc(dd.iso) : "마감일을 찾지 못함"}</div></div>
    <div><div class="k">리스크 높음</div><div class="v high">${c.high}</div><div class="n">주의 ${c.medium}</div></div>
    <div><div class="k">미해소 모순</div><div class="v conflict">${c.open}</div><div class="n">추가 공고로 해소 ${c.added}</div></div>
    <div><div class="k">질의 초안</div><div class="v">${c.q}</div><div class="n">빠진 문서 ${c.missRefs}</div></div>
    <div><div class="k">이탈 초안</div><div class="v">${c.d}</div><div class="n">리스크 높음에서</div></div>
    <div><div class="k">검토 완료</div><div class="v">${c.reviewed}/${c.total}</div><div class="n">추출 ${c.found}/${c.total}</div></div>
  </div>
  <div class="verdict">
    <div class="card pad"><div class="h3">입찰 전에 먼저 볼 것 ${top.length ? `<span class="muted small">${top.length}건</span>` : ""}</div>
      ${p.claude && p.claude.overall ? `<p style="margin-bottom:10px">${esc(p.claude.overall)}</p>` : ""}
      ${top.length ? `<ul class="toplist">${top.map(i => `<li>${i.conflict && i.conflict.status === "open" ? '<span class="flag f-open">모순</span>' : '<span class="flag r-high">높음</span>'}<span><b>${esc(i.label)}</b> ${esc(i.conflict && i.conflict.status === "open" ? i.conflict.values.map(v => `${typeLabel(v.type)} ${v.value}`).join(" vs ") : i.risk_reason)}</span></li>`).join("")}</ul>` : '<p class="muted">리스크 높음이나 미해소 모순이 없습니다.</p>'}
      <div class="btns" style="margin-top:12px"><button class="btn sm" data-go="issues">모순·리스크 보기</button><button class="btn sm" data-go="drafts">질의·이탈 초안 ${c.q + c.d}건</button>

// 04 원문 형광펜
function marksFor(p, doc, pageNo) {
  const text = doc.pages.find(x => x.number === pageNo)?.text || "";
  const spans = [];
  for (const it of items(p)) {
    const cs = it.candidates.filter(c => c.docId === doc.id && c.page === pageNo);
    for (const c of cs) {
      const words = c.evidence.replace(/…$/, "").split(/\s+/).filter(Boolean).slice(0, 7).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      if (!words.length) continue;
      const m = new RegExp(words.join("\\s+")).exec(text); if (!m) continue;
      let s = m.index, e = m.index + m[0].length;
      if (c.raw) { const r = new RegExp(c.raw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+")).exec(text.slice(s, s + c.evidence.length + 80)); if (r) { e = s + r.index + r[0].length; s = s + r.index; } }
      else { const nl = text.indexOf("\n", e); e = Math.min(nl === -1 ? text.length : nl, s + 160); }
      spans.push({ s, e, it, applied: c.docId === it.docId });
    }
  }
  spans.sort((a, b) => a.s - b.s || b.e - a.e);
  const out = []; let last = -1; for (const sp of spans) { if (sp.s >= last) { out.push(sp); last = sp.e; } }
  return { text, spans: out };
}
function vSource(p) {
  const live = p.docs.filter(d => d.status === "done");
  if (!st.src.doc || !docOf(p, st.src.doc)) st.src = { doc: live[0].id, page: live[0].pages[0].number, focus: null };
  const doc = docOf(p, st.src.doc), pages = doc.pages, pi = pages.findIndex(x => x.number === st.src.page), page = pages[Math.max(0, pi)];
  const { text, spans } = marksFor(p, doc, page.number);
  let html = "", at = 0;
  for (const sp of spans) { html += esc(text.slice(at, sp.s)) + `<mark class="hl ${GCLS[sp.it.group]} ${st.src.focus === sp.it.key ? "focus" : ""}" data-k="${sp.it.key}" tabindex="0" title="${esc(sp.it.label)}${sp.applied ? "" : " (다른 문서 값이 적용됨)"}">${esc(text.slice(sp.s, sp.e))}<sup>${esc(sp.it.label)}</sup></mark>`; at = sp.e; }
  html += esc(text.slice(at));
  const counts = Object.fromEntries(live.map(d => [d.id, items(p).reduce((n, it) => n + it.candidates.filter(c => c.docId === d.id).length, 0)]));
  const fit = st.src.focus && items(p).find(i => i.key === st.src.focus);
  return `<div class="sec-h"><h2>원문 형광펜</h2></div>
  <p class="lede">추출한 값이 원문 어디에서 나왔는지 칠해 보여 줍니다. 색은 요약표 묶음입니다. 칠한 곳을 누르면 그 항목의 판정이 오른쪽에 나옵니다.</p>
  <div class="legend">${E.GROUPS.map(g => `<span><i class="sw ${GCLS[g]}" style="background:var(--hl-${GCLS[g].slice(1)})"></i>${g}</span>`).join("")}</div>
  <div class="srcbar"><label class="small" for="sdoc">문서</label><select class="sel" id="sdoc">${live.map(d => `<option value="${d.id}" ${d.id === doc.id ? "selected" : ""}>${esc(shortDoc(d))} · ${esc(typeLabel(d.type))} · 추출 ${counts[d.id]}</option>`).join("")}</select>
    <button class="btn sm" id="pprev" ${pi <= 0 ? "disabled" : ""}>이전 쪽</button><span class="mono small">${page.number} / ${pages.length}</span><button class="btn sm" id="pnext" ${pi >= pages.length - 1 ? "disabled" : ""}>다음 쪽</button></div>
  <div class="src-grid"><div class="paper"><div class="run"><span>${esc(doc.name)}</span><span>${esc(typeLabel(doc.type))} · ${doc.kind === "pdf" ? "쪽" : "구간"} ${page.number}</span></div><pre id="ptext">${html}</pre></div>
  <div class="card side"><div class="pad" style="border-bottom:1px solid var(--line-2)">${fit ? `<div class="btns"><b>${esc(fit.label)}</b>${flagsOf(fit)}</div><div class="mono small" style="margin:4px 0">${esc(fit.value || "")}</div><p class="small">${esc(fit.risk_reason || "")}</p>${fit.conflict ? `<p class="small muted" style="margin-top:4px">${esc(fit.conflict.rule)}</p>` : ""}${fit.docId !== doc.id && fit.found ? `<p class="small" style="margin-top:4px">적용 값 출처: ${refBtn(p, fit.docId, fit.pages[0], fit.evidence.slice(0, 80))}</p>` : ""}` : `<span class="small muted">이 쪽에서 칠한 곳 ${spans.length}개. 칠한 곳이나 아래 목록을 누르세요.</span>`}</div>
    <div class="mlist">${spans.map(sp => `<button class="mrow ${st.src.focus === sp.it.key ? "on" : ""}" data-k="${sp.it.key}"><span>${esc(sp.it.label)}</span><span class="flag r-${sp.it.risk}">${RISK[sp.it.risk]}</span><span class="vv">${esc(text.slice(sp.s, sp.e).slice(0, 70))}</span></button>`).join("") || '<div class="pad small muted">이 쪽에는 추출한 값이 없습니다.</div>'}</div></div></div>`;
}

function evidencePrompt(p, per) {

  }
  const ex = [...used.values()].map(({ d, c, n }) => `<chunk n="${n}" doc="${esc(d.name)}" type="${typeLabel(d.type)}" page="${c.page}">\n${c.text}\n</chunk>`).join("\n");

입찰 건: ${p.name}
<items>
${lines.join("\n")}

<chunks>

async function claudeExtract(p) {

}

      inputSchema: { type: "object", properties: { query: { type: "string" }, top_k: { type: "integer", description: "1~8" } }, required: ["query"] },
      execute: inp => { const q = String(inp.query || ""); prog(`🔎 "${q}" 검색`); const k = Math.max(1, Math.min(Number(inp.top_k) || 5, 8));
        const hits = docs.flatMap(d => d.index.search(E.expandQuery(q), k).map(h => ({ d, ...h }))).sort((a, b) => b.score - a.score).slice(0, k);
        return hits.length ? hits.map(h => `<result doc="${h.d.name}" type="${typeLabel(h.d.type)}" page="${h.chunk.page}">\n${h.chunk.text}\n</result>`).join("\n") : "검색 결과가 없습니다. 동의어로 다시 검색하세요."; } },
    { name: "read_pages", description: "문서 하나의 지정한 쪽 범위 전문을 읽습니다. doc은 파일명(또는 문서 번호 1부터), 한 번에 최대 3쪽.",
      inputSchema: { type: "object", properties: { doc: { type: "string" }, start_page: { type: "integer" }, end_page: { type: "integer" } }, required: ["doc", "start_page"] },
      execute: inp => { const d = pick(inp.doc); if (!d) throw new Error("문서를 찾지 못했습니다. 파일명: " + docs.map(x => x.name).join(", "));
        const n = d.pages.length, a = Math.max(1, Number(inp.start_page) || 1), b = Math.min(Number(inp.end_page) || a, a + 2, n); if (a > n) throw new Error(`${d.name}은 ${n}쪽까지 있습니다.`);
        prog(`📄 ${shortDoc(d)} p.${a}${b > a ? "–" + b : ""}`); return d.pages.slice(a - 1, b).map(x => `<page doc="${d.name}" number="${x.number}">\n${x.text.slice(0, 9000)}\n</page>`).join("\n"); } },
    { name: "get_summary", description: "이미 만든 입찰 요약표(항목·적용 값·출처·리스크·모순 여부)와 질의·이탈 초안 목록을 돌려줍니다.",
      execute: () => { prog("📋 요약표 참조"); return { items: items(p).map(i => ({ label: i.label, value: i.value, doc: i.docName, page: i.pages[0], risk: i.risk, conflict: i.conflict ? { status: i.conflict.status, values: i.conflict.values.map(v => v.value + " @ " + v.docName) } : null })), drafts: [...p.drafts.Q, ...p.drafts.D].map(x => x.id + " " + x.label) }; } },
  ];
}
function offline(p, q) {
  return p.built.docs.flatMap(d => E.offlineAnswer(d.index, q).map(x => ({ ...x, docId: d.id, s: d.index.search(E.expandQuery(q), 1)[0]?.score || 0 }))).sort((a, b) => b.s - a.s).slice(0, 5);
}
async function ask(p, q) {
  if (st.busy) return;
  p.chat.push({ role: "user", content: q });
  if (!st.sample) { p.chat.push({ role: "assistant", content: "관련 조항의 핵심 문장입니다. (Claude를 쓸 수 없는 환경이라 발췌만 보여 드립니다.)", passages: offline(p, q), offline: true }); renderTab(); return; }
  const ctl = new AbortController(), msg = { role: "assistant", content: "", pending: true, trace: [] };
  p.chat.push(msg); st.busy = { kind: "chat", ctl, trace: msg.trace }; renderTab();
  const turns = p.chat.filter(m => !m.pending && m.content && !m.offline).slice(-7, -1).map(m => ({ role: m.role, content: m.content }));
  const head = `${CHAT_RULES}\n\n[입찰 건: ${p.name}] 문서: ${p.built.docs.map((d, i) => `${i + 1}) ${d.name}(${typeLabel(d.type)}, ${d.pages.length}쪽)`).join(", ")}`;
  let input;
  if (st.tools) input = [{ role: "user", content: head }, ...turns, { role: "user", content: q }];
  else { const ctx = p.built.docs.flatMap(d => d.index.search(E.expandQuery(q), 3).map(h => ({ d, ...h }))).sort((a, b) => b.score - a.score).slice(0, 6).map(h => `<chunk doc="${h.d.name}" page="${h.chunk.page}">\n${h.chunk.text}\n</chunk>`).join("\n");
    input = [{ role: "user", content: head.replace(/문서 내용은 반드시 도구[^\n]+\n/, "아래 발췌만 근거로 답하세요.\n") }, ...turns, { role: "user", content: `<excerpts>\n${ctx}\n</excerpts>\n\n질문: ${q}` }]; }
  try {
    const opts = { signal: ctl.signal, onText: ({ text }) => { msg.content = text; if (st.tab === "ask") { const box = $("#msgs"); if (box) { box.lastElementChild.outerHTML = msgHtml(p, msg); bindCommon(box); box.scrollTop = box.scrollHeight; } } } };
    if (st.tools) opts.tools = chatTools(p); else opts.cache = false;
    const r = await st.sample(input, opts);
    msg.content = r.text + (r.truncated ? "\n\n(답이 길어 중간에 끊겼습니다. 질문을 좁혀 주세요.)" : "");
  } catch (e) {
    msg.content = e.code === "refused" ? "" : (e.text || "");
    if (e.code === "cancelled") msg.content += (msg.content ? "\n\n" : "") + "(중지함)";
    else { msg.content += (msg.content ? "\n\n" : "") + errCopy(e.code); msg.offline = true; msg.passages = offline(p, q); }
    if (e.code === "tools_unavailable") st.tools = false; failClaude(e);
  }
  msg.pending = false; st.busy = null; renderAll();
}

// ── 내보내기 ─────────────────────────────────────
function summaryRows(p) {
  return [["묶음", "항목", "적용 값", "리스크", "판정 사유", "모순", "출처 문서", "쪽", "담당", "근거 원문", "문서별 값", "검토 완료"],
    ...items(p).map(i => [i.group, i.label, i.value, RISK[i.risk], i.risk_reason, i.conflict ? (i.conflict.status === "open" ? "미해소" : "추가 공고 반영") : "", i.docName, i.pages.join(","), i.dept, i.evidence,
      i.candidates.map(c => `${c.value} @ ${c.docName} p.${c.page}`).join(" / "), review(p)[i.key] ? "예" : ""])];
}
function draftRows(p) { const d = p.claudeDrafts || p.drafts; return [["번호", "구분", "항목", "근거", "출처", "담당", "한국어", "영문"], ...[...d.Q, ...d.D].map(x => [x.id, x.id[0] === "Q" ? "질의" : "이탈", x.label, x.basis, x.where, x.owner, x.ko, x.en])]; }
async function saveCsv(p, which) {
  const rows = which === "drafts" ? draftRows(p) : summaryRows(p);
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  try { await st.downloads.save({ filename: `${p.name.replace(/[\\/:*?"<>|]/g, "_")}_${which === "drafts" ? "질의이탈" : "입찰요약표"}.csv`, data: csv }); toast("CSV를 저장했습니다."); }
  catch (e) { if (e.code !== "declined") toast("저장하지 못했습니다. '복사'로 엑셀에 붙여 넣어 주세요."); }
}
const copyRows = rows => copyText(rows.map(r => r.map(v => String(v ?? "").replace(/[\t\n]+/g, " ")).join("\t")).join("\n"), "표를 복사했습니다. 엑셀에 붙여 넣으세요.");
async function copyText(t, ok) { try { await navigator.clipboard.writeText(t); toast(ok); } catch { toast("복사가 막혀 있습니다. 내용을 직접 선택해 복사해 주세요."); } }
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3400); }

$("#file").onchange = e => { if (e.target.files.length) addFiles(e.target.files, st.pickInto); e.target.value = ""; };
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { if (e.target.closest && e.target.closest("#drop")) return; e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files, cur()); });

// ── 시작: 가상 샘플 입찰 건 2개 ─────────────────────
const SAMPLES = JSON.parse($("#samples").textContent);
const first = addSamplePkg(SAMPLES.bundle); addSamplePkg(SAMPLES.ko);
st.cur = first.id; st.tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "summary";
renderAll();
(async () => {
  const c = window.claude; if (!c || !c.use) return;
  const [sample, downloads] = await Promise.all([c.use("sample").catch(() => null), c.use("downloads").catch(() => null)]);
  st.downloads = downloads;
  if (sample) { st.sample = sample; const lim = await sample.limits().catch(() => null); st.tools = !!(lim && lim.tools); }
  renderAll();
})();
})();
</script>
