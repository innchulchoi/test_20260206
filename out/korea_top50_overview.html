<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대한민국 50대 기업집단 조직도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f0f2f5;--line:#e2e5ea;--line-2:#cfd4dc;
  --text:#14171c;--muted:#5d6672;--faint:#8a929d;
  --accent:#1f5eff;--accent-soft:#e8efff;--accent-text:#1747c4;
  --ok:#14804a;--ok-soft:#e5f5ec;--warn:#9a5b00;--warn-soft:#fff3dc;--fin:#7a3fd1;--fin-soft:#f1eafd;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a20;--surface-2:#1e222a;--line:#2a2f38;--line-2:#3a404b;
  --text:#e9ecf1;--muted:#a3abb7;--faint:#7c8591;
  --accent:#6f9bff;--accent-soft:#1c2740;--accent-text:#9db9ff;
  --ok:#4cc38a;--ok-soft:#15291f;--warn:#f0b35a;--warn-soft:#2d2414;--fin:#b794f6;--fin-soft:#251d36;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a20;--surface-2:#1e222a;--line:#2a2f38;--line-2:#3a404b;
  --text:#e9ecf1;--muted:#a3abb7;--faint:#7c8591;
  --accent:#6f9bff;--accent-soft:#1c2740;--accent-text:#9db9ff;
  --ok:#4cc38a;--ok-soft:#15291f;--warn:#f0b35a;--warn-soft:#2d2414;--fin:#b794f6;--fin-soft:#251d36;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-text)}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .src{color:var(--faint);font-size:12px}
.search{margin-left:auto;position:relative;flex:0 1 340px;min-width:200px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--text);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:60vh;overflow:auto;display:none}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface-2)}
.results small{color:var(--muted)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
.side button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:none;padding:7px 14px;text-align:left;cursor:pointer;border-left:3px solid transparent}
.side button:hover{background:var(--surface-2)}
.side button.on{background:var(--accent-soft);border-left-color:var(--accent)}
.side .rk{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
.side .as{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.side .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line-2);margin-left:6px;vertical-align:middle}
.side .dot.ok{background:var(--ok)}
main{padding:20px 24px 60px;min-width:0}
.head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0;font-size:24px;letter-spacing:-.02em}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.fin{background:var(--fin-soft);color:var(--fin);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.note{color:var(--muted);font-size:13px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:13px}
.notice code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
/* ownership tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:16px;border-left:1px solid var(--line-2)}
.tree li{position:relative;padding:3px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:16px;width:12px;border-top:1px solid var(--line-2)}
.node{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:default}
.node.has{cursor:pointer;border-color:var(--line-2)}
.node.has:hover{border-color:var(--accent)}
.node.root{background:var(--text);color:var(--bg);border-color:transparent;font-weight:600}
.node .pct{font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:600;font-size:12px}
.node .cnt{color:var(--faint);font-size:12px}
.tog{border:0;background:none;cursor:pointer;color:var(--faint);width:18px;padding:0}
/* company chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips button small{color:inherit;opacity:.65;margin-left:4px}
/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.person:hover{border-color:var(--accent)}
.person .nm{font-weight:600;font-size:15px}
.person .ps{color:var(--muted);font-size:12px}
.person .jb{font-size:12px;margin-top:4px;color:var(--text);opacity:.85}
/* exec org chart */
.unit{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;background:var(--surface)}
.unit>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-weight:600}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary::before{content:"▸";color:var(--faint);transition:transform .15s}
.unit[open]>summary::before{transform:rotate(90deg)}
.unit>summary .cnt{color:var(--faint);font-weight:400;font-size:12px}
.unit .body{padding:0 12px 10px 24px}
.unit .unit{background:var(--surface-2)}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:4px}
.row{display:flex;gap:8px;align-items:baseline;border:0;background:var(--surface);border-radius:6px;padding:5px 8px;cursor:pointer;text-align:left;border:1px solid transparent;min-width:0}
.row:hover{border-color:var(--accent)}
.row b{white-space:nowrap}
.row span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--surface)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{max-height:70vh;overflow:auto}
.overview td,.overview th{white-space:nowrap}
.overview tr{cursor:pointer}
.overview tbody tr:hover{background:var(--surface-2)}
.bar{height:6px;background:var(--accent);border-radius:3px;opacity:.75}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);max-width:560px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
dialog .dh h3{margin:0;font-size:18px}
dialog .db{padding:14px 18px;display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px}
dialog .db dt{color:var(--muted)}
dialog .db dd{margin:0;white-space:pre-wrap}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.foot{color:var(--faint);font-size:12px;margin-top:24px}
.menu{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;inset:58px 0 0 0;z-index:30;display:none;max-height:none}
  .side.open{display:block}
  .menu{display:inline-block;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer}
  main{padding:16px}
  .top{padding:10px 16px}
  .search{flex:1 1 100%;margin-left:0}
}
</style>
</head>

// Ownership: each company hangs under its largest in-group shareholder.
function tree(g){
  const names = new Set(g.companies.map(c=>c.name));
  const best = {};
  for (const e of g.edges) {
    if (!names.has(e.child)) continue;
    if (e.parent!=="__OWNER__" && !names.has(e.parent)) continue;
    const cur = best[e.child];
    // a company parent wins over the owner's personal stake when it is larger; ties prefer the company
    if (!cur || e.stake > cur.stake || (e.stake===cur.stake && cur.parent==="__OWNER__")) best[e.child] = e;
  }
  // break cycles (cross-holdings): walk up, cut where we revisit
  for (const c of Object.keys(best)) {
    const seen = new Set([c]); let p = best[c].parent;
    while (p && p!=="__OWNER__" && best[p]) { if (seen.has(p)) { delete best[c]; break; } seen.add(p); p = best[p].parent; }
  }
  const kids = {};
  for (const [c,e] of Object.entries(best)) (kids[e.parent] ||= []).push({name:c, stake:e.stake, src:e.source});
  return {best, kids};
}
function topHolding(g){
  const {kids} = tree(g);
  const top = (kids.__OWNER__||[]).map(k=>({...k, n:count(kids,k.name)})).sort((a,b)=>b.n-a.n)[0];
  if (top && top.n>0) return top.name;
  const roots = g.companies.filter(c=>kids[c.name] && !Object.values(kids).flat().some(k=>k.name===c.name));
  roots.sort((a,b)=>count(kids,b.name)-count(kids,a.name));
  return roots[0]?.name || null;
}
function count(kids, n, seen=new Set()){ if (seen.has(n)) return 0; seen.add(n); return (kids[n]||[]).reduce((s,k)=>s+1+count(kids,k.name,seen),0); }

function treeView(g){
  const byName = Object.fromEntries(g.companies.map(c=>[c.name,c]));
  const {best, kids} = tree(g);
  const node = (n, stake, depth) => {
    const c = byName[n], ch = (kids[n]||[]).sort((a,b)=>count(kids,b.name)-count(kids,a.name) || b.stake-a.stake);
    const ex = c?.executives?.length || 0;
    const tags = [c?.stock_code?`<span class="tag acc">상장 ${c.stock_code}</span>`:"", c?.financial?`<span class="tag fin">금융</span>`:"", ex?`<span class="cnt">임원 ${ex}</span>`:""].join("");
    const sub = ch.length ? `<ul ${depth>=2?"hidden":""}>${ch.map(k=>node(k.name,k.stake,depth+1)).join("")}</ul>` : "";
    return `<li>${ch.length?`<button class="tog" aria-label="펼치기">${depth>=2?"▸":"▾"}</button>`:`<span class="tog"></span>`}<span class="node ${ex?"has":""}" ${ex?`data-c="${esc(n)}"`:""}>${stake!=null?`<span class="pct">${stake.toFixed(1)}%</span>`:""}${esc(clean(n))}${tags}${ch.length?`<span class="cnt">· 하위 ${count(kids,n)}</span>`:""}</span>${sub}</li>`;
  };
  const owned = kids.__OWNER__ || [];
  const placed = new Set(Object.keys(best));
  const roots = g.companies.filter(c=>!placed.has(c.name) && kids[c.name]).map(c=>c.name);
  const loose = g.companies.filter(c=>!placed.has(c.name) && !kids[c.name]);
  let html = `<div class="card"><h3>지배구조</h3><p class="note">각 계열사를 그룹 안에서 지분이 가장 큰 주주 밑에 두었습니다. 지분율은 정기보고서의 타법인출자현황과 최대주주현황 기준입니다. 임원 수가 표시된 회사를 누르면 조직도로 이동합니다.</p>
    <ul class="tree"><li><span class="tog"></span><span class="node root">동일인 · ${esc(g.same_person)}</span><ul>${owned.sort((a,b)=>count(kids,b.name)-count(kids,a.name)).map(k=>node(k.name,k.stake,1)).join("")}${roots.map(r=>node(r,null,1)).join("")}</ul></li></ul></div>`;
  if (loose.length) html += `<div class="card"><h3>지분 연결 정보가 없는 계열사 <span class="note">${loose.length}곳</span></h3><p class="note">DART 정기보고서를 내지 않는 비상장사 등은 출자 관계를 공시에서 확인할 수 없습니다.</p><div class="chips">${loose.map(c=>`<button ${c.executives?.length?`data-c="${esc(c.name)}"`:"disabled"}>${esc(clean(c.name))}${c.financial?" <small>금융</small>":""}</button>`).join("")}</div></div>`;
  return html;
}

function unitHtml(u, ex, depth){
  const people = u.people.map(i=>ex[i]);
  const rows = people.length ? `<div class="rows">${people.map(e=>`<button class="row" data-p="${ex.indexOf(e)}"><b>${esc(e.nm)}</b><span>${esc(e.ofcps)} · ${esc(e.chrg_job||"-")}</span></button>`).join("")}</div>` : "";
  const kids = u.children.map(k=>`<details class="unit" ${depth<1?"open":""}><summary>${esc(k.name)} <span class="cnt">${k.size}명</span></summary><div class="body">${unitHtml(k, ex, depth+1)}</div></details>`).join("");
  return rows + kids;
}

function orgView(g){
  const list = g.companies.filter(c=>c.executives?.length).sort((a,b)=>b.executives.length-a.executives.length);
  if (!list.length) return `<div class="card note">이 그룹에서 임원현황을 공시한 계열사가 없습니다.</div>`;
  const c = list.find(x=>x.name===st.c) || list[0];
  const ex = c.executives, reg = ex.filter(isReg), url = dartUrl(c.report);
  const pos = {}; reg.forEach(e=>{ const k=e.rgist_exctv_at; (pos[k] ||= []).push(e); });
  const order = ["사내이사","기타비상무이사","사외이사","감사"];
  const regKeys = Object.keys(pos).sort((a,b)=>(order.indexOf(a)+99)%99-(order.indexOf(b)+99)%99);
  const unreg = ex.length - reg.length;
  return `<div class="chips">${list.map(x=>`<button class="${x===c?"on":""}" data-c="${esc(x.name)}">${esc(clean(x.name))}<small>${x.executives.length}</small></button>`).join("")}</div>
  <div class="card">
    <div class="head" style="margin-bottom:6px"><h2 style="font-size:20px">${esc(clean(c.name))}</h2>
      ${c.stock_code?`<span class="tag acc">상장 ${c.stock_code}</span>`:`<span class="tag">비상장</span>`}${c.financial?`<span class="tag fin">금융</span>`:""}
      ${c.match==="jurir-mismatch"?`<span class="tag warn" title="같은 이름의 다른 법인일 수 있습니다">법인등록번호 불일치</span>`:""}</div>
    <div class="note">대표이사 ${esc(c.profile?.ceo_nm||"-")} · ${esc(c.report?.label||"")}${c.report?.stlm_dt?` (기준 ${esc(c.report.stlm_dt)})`:""}${url?` · <a href="${url}" target="_blank" rel="noopener">DART 원문</a>`:""}</div>
  </div>
  <div class="card"><h3>이사회 · 등기임원 <span class="note">${reg.length}명</span></h3>
    ${regKeys.map(k=>`<div class="note" style="margin:8px 0 6px">${esc(k)} ${pos[k].length}명</div><div class="board">${pos[k].map(e=>`<button class="person" data-p="${ex.indexOf(e)}"><div class="nm">${esc(e.nm)}</div><div class="ps">${esc(e.ofcps)}${e.fte_at?` · ${esc(e.fte_at)}`:""}</div><div class="jb">${esc(e.chrg_job||"")}</div></button>`).join("")}</div>`).join("") || '<p class="note">없음</p>'}
  </div>
  <div class="card"><h3>경영진 조직도 · 미등기임원 <span class="note">${unreg}명</span></h3>
    <p class="note">공시된 담당업무 문구에서 부문·사업부·본부·실 단위를 읽어 묶었습니다. 단위가 적혀 있지 않은 임원은 맨 위에 둡니다.</p>
    ${c.org ? unitHtml(c.org, ex, 0) : ""}
  </div>`;
}

function listView(g){
  const label = {name:"이름 일치", jurir:"법인번호 확인", "name-ambiguous":"동명 법인 다수", "jurir-mismatch":"법인번호 불일치", unmatched:"DART 미등록", skipped:"건너뜀", pending:"미수집"};
  const rows = g.companies.slice().sort((a,b)=>(b.executives?.length||0)-(a.executives?.length||0) || a.name.localeCompare(b.name,"ko")).map(c=>`<tr>
    <td>${c.executives?.length?`<a href="#" data-c="${esc(c.name)}">${esc(c.name)}</a>`:esc(c.name)}</td>
    <td>${c.stock_code?`<span class="tag acc">${c.stock_code}</span>`:""}${c.financial?` <span class="tag fin">금융</span>`:""}</td>
    <td>${esc(c.profile?.ceo_nm||"")}</td><td>${esc(c.report?.label||"")}</td><td class="num">${c.executives?.length||""}</td>
    <td><span class="tag ${c.match==="jurir-mismatch"||c.match==="name-ambiguous"?"warn":""}">${label[c.match]||esc(c.match)}</span></td></tr>`).join("");
  return `<div class="card tbl"><table><thead><tr><th>회사명 (공정위 명단)</th><th>구분</th><th>대표이사</th><th>보고서</th><th>임원</th><th>DART 매칭</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function groupView(g){
  const ex = g.companies.reduce((s,c)=>s+(c.executives?.length||0),0);
  const filers = g.companies.filter(c=>c.executives?.length).length;
  const listed = g.companies.filter(c=>c.stock_code).length;
  const holding = g.collected ? topHolding(g) : null;
  let body;
  if (!g.collected) { st.tab = "list"; body = `<div class="notice">이 그룹은 아직 DART 공시를 수집하지 않았습니다. <code>python scripts/collect.py --group ${esc(g.name)}</code> 실행 후 다시 빌드하세요. 아래는 공정위 계열사 명단입니다.</div>` + listView(g); }
  else body = st.tab==="org" ? orgView(g) : st.tab==="list" ? listView(g) : treeView(g);
  return `<div class="head"><h2>${esc(g.name)}</h2><span class="tag">${g.rank}위${g.change?` (${esc(g.change)})`:""}</span>${g.cross_holding_restricted?'<span class="tag acc">상호출자제한</span>':""}${g.aliases?.length?`<span class="note">${esc(g.aliases.join(" · "))}</span>`:""}</div>
  <div class="stats">
    <div class="stat"><b>${esc(g.same_person)}</b><span>동일인</span></div>
    ${holding?`<div class="stat"><b style="font-size:16px">${esc(clean(holding))}</b><span>최상위 회사(지분 기준)</span></div>`:""}
    <div class="stat"><b>${jo(g.assets_krw_bn)}조</b><span>공정자산총액</span></div>
    <div class="stat"><b>${g.affiliate_count}</b><span>계열사${g.collected?` · 상장 ${listed}`:""}</span></div>
    ${g.collected?`<div class="stat"><b>${ex.toLocaleString()}</b><span>공시 임원 · ${filers}개사</span></div>`:""}
  </div>
  ${g.collected?`<div class="tabs">${[["tree","지배구조"],["org","임원 조직도"],["list","계열사 목록"]].map(([k,l])=>`<button class="${st.tab===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div>`:""}
  ${body}`;
}

function person(g, c, i){
  const e = c.executives[i];
  $("#dn").textContent = e.nm;
  $("#ds").textContent = `${clean(c.name)} · ${e.ofcps||""}`;
  const f = [["등기여부",e.rgist_exctv_at],["상근여부",e.fte_at],["담당업무",e.chrg_job],["출생",e.birth_ym],["성별",e.sexdstn],["주요경력",e.main_career],["최대주주 관계",e.mxmm_shrholdr_relate],["재직기간",e.hffc_pd],["임기만료",e.tenure_end_on],["출처",c.report?.label]];
  $("#db").innerHTML = f.filter(([,v])=>v && v!=="-").map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  $("#dlg").showModal();
}
$("#dx").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("click", e => { if (e.target.id==="dlg") $("#dlg").close(); });
$("#menu").onclick = () => $("#side").classList.toggle("open");

function render(){
  side();
  const g = D.groups.find(x=>x.rank===st.g);
  const m = $("#main");
  m.innerHTML = (g ? groupView(g) : overview()) + `<p class="foot">공정위 계열사 명단과 DART 정기보고서 '임원 및 직원 등의 현황'을 자동으로 모은 자료입니다. 보고서 기준일 이후의 인사 변동은 반영되지 않습니다.</p>`;
  if (!g) { m.querySelectorAll("tr[data-g]").forEach(tr=>tr.onclick=()=>go(+tr.dataset.g,"tree")); return; }
  m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go(g.rank,b.dataset.t, st.c));
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=ev=>{ev.preventDefault(); go(g.rank,"org",b.dataset.c);});
  m.querySelectorAll(".tog").forEach(b=>b.tagName==="BUTTON" && (b.onclick=()=>{const ul=b.parentElement.querySelector(":scope>ul"); ul.hidden=!ul.hidden; b.textContent=ul.hidden?"▸":"▾";}));
  const c = g.companies.filter(x=>x.executives?.length).sort((a,b)=>b.executives.length-a.executives.length).find(x=>x.name===st.c) || g.companies.filter(x=>x.executives?.length).sort((a,b)=>b.executives.length-a.executives.length)[0];
  m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>person(g,c,+b.dataset.p));
}

// search across groups, companies and people
const idx = [];
for (const g of D.groups) {
  idx.push({k:g.name+" "+(g.aliases||[]).join(" ")+" "+g.same_person, label:g.name, sub:`${g.rank}위 기업집단`, go:()=>go(g.rank,"tree")});
  for (const c of g.companies) {
    idx.push({k:c.name+" "+(c.dart_name||""), label:clean(c.name), sub:`${g.name} 계열사`, go:()=>go(g.rank, c.executives?.length?"org":"list", c.name)});
    (c.executives||[]).forEach((e,i)=>idx.push({k:e.nm, label:e.nm, sub:`${clean(c.name)} · ${e.ofcps||""} · ${e.chrg_job||""}`, go:()=>{go(g.rank,"org",c.name); setTimeout(()=>person(g,c,i),50);}}));
  }
}
const q = $("#q"), res = $("#res");
q.addEventListener("input", () => {
  const s = q.value.trim().replace(/\s+/g,"");
  if (!s) { res.classList.remove("on"); return; }
  const hits = idx.filter(x=>x.k.replace(/\s+/g,"").includes(s)).slice(0,40);
  res.innerHTML = hits.length ? hits.map((h,i)=>`<button data-i="${i}">${esc(h.label)} <small>${esc(h.sub)}</small></button>`).join("") : `<div class="note" style="padding:10px 12px">결과 없음</div>`;
  res.querySelectorAll("button").forEach(b=>b.onclick=()=>{hits[+b.dataset.i].go(); res.classList.remove("on"); q.blur();});
  res.classList.add("on");
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.classList.remove("on"); });

readHash();
if (st.g==null && D.groups.length===1) st.g = D.groups[0].rank;
render();
</script>
</body>
</html>
