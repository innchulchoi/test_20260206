<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f0f2f5;--line:#e2e5ea;--line-2:#cfd4dc;
  --text:#14171c;--muted:#5d6672;--faint:#8a929d;
  --accent:#1f5eff;--accent-soft:#e8efff;--accent-text:#1747c4;
  --ok:#14804a;--ok-soft:#e5f5ec;--warn:#9a5b00;--warn-soft:#fff3dc;--fin:#7a3fd1;--fin-soft:#f1eafd;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --r:10px;--hh:58px;
  --c1:#2f6bff;--c2:#12a37f;--c3:#c08a00;--c4:#8a6fd6;--c5:#0e9bb5;
  --new:#d9480f;--new-soft:#fff0e6;--up:#0b7a3e;--up-soft:#e3f6ea;--mv:#5b6573;--mv-soft:#eef0f3;--src:#a3127a;--src-soft:#fbe9f5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a20;--surface-2:#1e222a;--line:#2a2f38;--line-2:#3a404b;
  --text:#e9ecf1;--muted:#a3abb7;--faint:#7c8591;
  --accent:#6f9bff;--accent-soft:#1c2740;--accent-text:#9db9ff;
  --ok:#4cc38a;--ok-soft:#15291f;--warn:#f0b35a;--warn-soft:#2d2414;--fin:#b794f6;--fin-soft:#251d36;
  --shadow:none;
  --c1:#6f9bff;--c2:#3fcf9f;--c3:#e6b740;--c4:#b59cff;--c5:#4cc9e0;
  --new:#ff8a4c;--new-soft:#3a2216;--up:#4cc38a;--up-soft:#15291f;--mv:#a3abb7;--mv-soft:#252a33;--src:#f07bd0;--src-soft:#3a1932;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a20;--surface-2:#1e222a;--line:#2a2f38;--line-2:#3a404b;
  --text:#e9ecf1;--muted:#a3abb7;--faint:#7c8591;
  --accent:#6f9bff;--accent-soft:#1c2740;--accent-text:#9db9ff;
  --ok:#4cc38a;--ok-soft:#15291f;--warn:#f0b35a;--warn-soft:#2d2414;--fin:#b794f6;--fin-soft:#251d36;
  --shadow:none;
  --c1:#6f9bff;--c2:#3fcf9f;--c3:#e6b740;--c4:#b59cff;--c5:#4cc9e0;
  --new:#ff8a4c;--new-soft:#3a2216;--up:#4cc38a;--up-soft:#15291f;--mv:#a3abb7;--mv-soft:#252a33;--src:#f07bd0;--src-soft:#3a1932;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-text)}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .src{color:var(--faint);font-size:12px}
.search{margin-left:auto;position:relative;flex:0 1 340px;min-width:200px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--text);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:60vh;overflow:auto;display:none}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface-2)}
.results small{color:var(--muted)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
.side button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:none;padding:7px 14px;text-align:left;cursor:pointer;border-left:3px solid transparent}
.side button:hover{background:var(--surface-2)}
.side button.on{background:var(--accent-soft);border-left-color:var(--accent)}
.side .rk{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
.side .as{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.side .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line-2);margin-left:6px;vertical-align:middle}
.side .dot.ok{background:var(--ok)}
main{padding:20px 24px 60px;min-width:0}
.head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0;font-size:24px;letter-spacing:-.02em}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.fin{background:var(--fin-soft);color:var(--fin);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.note{color:var(--muted);font-size:13px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:13px}
.notice code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
/* ownership tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:16px;border-left:1px solid var(--line-2)}
.tree li{position:relative;padding:3px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:16px;width:12px;border-top:1px solid var(--line-2)}
.node{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:default}
.node.has{cursor:pointer;border-color:var(--line-2)}
.node.has:hover{border-color:var(--accent)}
.node.root{background:var(--text);color:var(--bg);border-color:transparent;font-weight:600}
.node .pct{font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:600;font-size:12px}
.node .cnt{color:var(--faint);font-size:12px}
.tog{border:0;background:none;cursor:pointer;color:var(--faint);width:18px;padding:0}
/* company chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips button small{color:inherit;opacity:.65;margin-left:4px}
/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.person:hover{border-color:var(--accent)}
.person .nm{font-weight:600;font-size:15px}
.person .ps{color:var(--muted);font-size:12px}
.person .jb{font-size:12px;margin-top:4px;color:var(--text);opacity:.85}
/* exec org chart: drill-down */
#org{scroll-margin-top:110px}
.small{display:flex;flex-wrap:wrap;gap:6px}
.small button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}
.small button:hover{border-color:var(--accent)}
.small button small{color:var(--faint);margin-left:4px}
.crumb{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:13px;margin-bottom:10px}
.crumb button{border:0;background:none;padding:2px 4px;border-radius:5px;cursor:pointer;color:var(--accent-text)}
.crumb button:hover{background:var(--accent-soft)}
.crumb .sep{color:var(--faint)}
.crumb .cur{font-weight:600;color:var(--text);padding:2px 4px}
.uhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:12px}
.uhead h3{margin:0;font-size:19px;letter-spacing:-.01em}
.lead{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--accent-soft);margin-bottom:14px;cursor:pointer;border:0;width:100%;text-align:left}
.lead .k{font-size:11px;color:var(--accent-text);font-weight:600;white-space:nowrap}
.lead b{font-size:15px}
.lead span{color:var(--muted);font-size:13px}
.sec{font-size:12px;color:var(--muted);font-weight:600;margin:16px 0 8px;letter-spacing:.02em}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ucard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.ucard:hover{border-color:var(--accent)}
.ucard .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ucard .t b{font-size:15px;overflow-wrap:anywhere}
.ucard .n{font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:600;white-space:nowrap}
.ucard .h{font-size:13px;color:var(--text)}
.ucard .h i{font-style:normal;color:var(--muted)}
.ucard .s{font-size:12px;color:var(--faint);overflow-wrap:anywhere}
.rank{margin-top:6px}
.rank>.rk{font-size:12px;color:var(--muted);padding:6px 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:16px}
.mem.hd b::after{content:"장";margin-left:5px;font-size:10px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:1px 5px;border-radius:4px;vertical-align:2px}
/* exec org chart (old nested view) */
.unit{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;background:var(--surface)}
.unit>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-weight:600}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary::before{content:"▸";color:var(--faint);transition:transform .15s}
.unit[open]>summary::before{transform:rotate(90deg)}
.unit>summary .cnt{color:var(--faint);font-weight:400;font-size:12px}
.unit .body{padding:0 12px 10px 24px}
.unit .unit{background:var(--surface-2)}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:4px}
.row{display:flex;gap:8px;align-items:baseline;border:0;background:var(--surface);border-radius:6px;padding:5px 8px;cursor:pointer;text-align:left;border:1px solid transparent;min-width:0}
.row:hover{border-color:var(--accent)}
.row b{white-space:nowrap}
.row span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--surface)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{max-height:70vh;overflow:auto}
.overview td,.overview th{white-space:nowrap}
.overview tr{cursor:pointer}
.overview tbody tr:hover{background:var(--surface-2)}
.bar{height:6px;background:var(--accent);border-radius:3px;opacity:.75}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);max-width:560px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
dialog .dh h3{margin:0;font-size:18px}
dialog .db{padding:14px 18px;display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px}
dialog .db dt{color:var(--muted)}
dialog .db dd{margin:0;white-space:pre-wrap}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.foot{color:var(--faint);font-size:12px;margin-top:24px}
.menu{display:none}
.menu[hidden],.side[hidden]{display:none!important}
/* round 2: badges, map, rows, news, targets */
body.single .layout{grid-template-columns:minmax(0,1fr)}
body.single main{max-width:1180px;margin:0 auto;width:100%}
.b{display:inline-block;font-style:normal;font-size:11px;font-weight:600;line-height:1.5;padding:0 6px;border-radius:5px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.b.new{background:var(--new-soft);color:var(--new)}.b.up{background:var(--up-soft);color:var(--up)}.b.mv{background:var(--mv-soft);color:var(--mv)}
.b.t1{background:var(--text);color:var(--bg)}.b.t2{background:var(--accent-soft);color:var(--accent-text)}.b.t3{background:var(--surface-2);color:var(--muted)}
.b.tg{background:var(--accent-soft);color:var(--accent-text)}.b.src{background:var(--src-soft);color:var(--src)}.b.after{background:var(--warn-soft);color:var(--warn)}
.b.disc{background:var(--surface-2);color:var(--muted);margin:0 4px 0 0}
.sumline{display:none;color:var(--muted);font-size:13px;margin:-6px 0 12px}
.sumline b{color:var(--text);font-weight:600}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:4px 0 6px}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.leaders{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.leaders button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer;min-height:44px}
.leaders button b{display:block;font-size:14px}.leaders button small{color:var(--muted);font-size:12px}
details.cat{border-top:1px solid var(--line);margin-top:8px}
details.cat>summary{list-style:none;cursor:pointer;padding:12px 2px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-height:44px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary::after{content:"▾";margin-left:auto;color:var(--faint);transition:transform .15s}
details.cat:not([open])>summary::after{transform:rotate(-90deg)}
details.cat>summary i{width:10px;height:10px;border-radius:3px;display:inline-block}
details.cat>summary small{font-weight:400;color:var(--muted);font-size:12px}
.urow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 2.6em minmax(0,1.3fr) 14px;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 4px;text-align:left;cursor:pointer;min-height:48px;color:inherit}
.urow:hover{background:var(--surface-2)}
.urow .un b{font-size:14px;overflow-wrap:anywhere}.urow .un small{color:var(--faint);font-size:11px;margin-left:6px}
.ubar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}.ubar i{display:block;height:100%;background:var(--accent);opacity:.7;border-radius:4px}
.uc{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.uh{font-size:13px;overflow-wrap:anywhere}.uh small{color:var(--muted)}
.chev{color:var(--faint);font-size:16px;text-align:right}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.subbar{position:sticky;top:var(--hh);z-index:10;background:var(--surface);margin:-16px -16px 12px;padding:6px 10px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;display:flex;gap:8px;align-items:center;min-height:52px}
.subbar .up{flex:0 0 auto;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:0 12px;min-height:40px;cursor:pointer;font-weight:600}
.subbar .crumb{flex:1 1 auto;margin:0;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.subbar .crumb button{min-height:40px}
.subbar .lv{flex:0 0 auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.lead{min-height:56px}.lead .lb{flex:1}.lead .chev{margin-left:auto}
.mem{display:grid;grid-template-columns:minmax(0,1fr) 14px;grid-template-areas:"t c" "j c" "s c";column-gap:8px;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 4px;text-align:left;cursor:pointer;width:100%;min-height:48px;color:inherit}
.mem:hover{background:var(--surface-2)}
.mem .mt{grid-area:t}.mem .mt b{font-size:15px}
.mem .mj{grid-area:j;font-size:13px;overflow-wrap:anywhere}.mem .mj.dim{color:var(--faint)}
.mem .ms{grid-area:s;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mem .chev{grid-area:c;align-self:center}
.mem.hd .mt b::after{content:"장";margin-left:5px;font-size:10px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:1px 5px;border-radius:4px;vertical-align:2px}
.rank>.rk small{color:var(--faint);font-weight:400}
.newsline{display:flex;gap:6px;align-items:center;width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font-size:13px;min-height:44px}
.newslist{list-style:none;margin:0;padding:0}
.newslist li.news{border-left:3px solid var(--src);background:var(--surface-2);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 8px}
.newslist li.co{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 4px}
.news .nm2{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted)}
.news .nm2 .b{margin:0}.news .cat{font-weight:600;color:var(--text)}
.news a{display:block;font-weight:600;font-size:14px;margin:3px 0;color:var(--text);text-decoration:none}
.news a::after{content:" ↗";color:var(--faint);font-weight:400}
.news .sum{font-size:13px;color:var(--muted)}
.news .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.news .links button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;min-height:32px}
details.more>summary{cursor:pointer;color:var(--accent-text);font-size:13px;padding:6px 0;min-height:36px}
.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.flt .fl{font-size:12px;color:var(--muted);width:2.6em}
.flt button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;min-height:36px}
.flt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.flt select{min-height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--text);padding:0 8px;font:inherit}
.flt .dl{border-radius:8px;background:var(--surface-2)}
.tlist{margin-top:8px}
.trow{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:start;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;text-align:left;cursor:pointer;color:inherit}
.trow:hover{background:var(--surface-2)}
.trow .tn{color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}

<body>
<header class="top">
  <button class="menu" id="menu" aria-label="그룹 목록">☰ 그룹</button>
  <div><h1 id="title"></h1><div class="src" id="src"></div></div>
  <div class="search"><input id="q" type="search" placeholder="임원·계열사·그룹 검색 (예: 이재용, 삼성전자)" autocomplete="off"><div class="results" id="res"></div></div>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dh"><div><h3 id="dn"></h3><div class="note" id="ds"></div></div><button class="x" id="dx" aria-label="닫기">×</button></div><div class="dbody"><dl class="db" id="db"></dl><div id="dx2" class="dx2"></div></div></dialog>
<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jo = v => (v/1000).toLocaleString("ko-KR",{maximumFractionDigits:1});
const isReg = e => { const v=(e.rgist_exctv_at||"").trim(); return v && v!=="-" && !v.includes("미등기"); };
const clean = n => n.replace(/^\(주\)|\(주\)$|^㈜|㈜$/g,"").trim();
const dartUrl = r => r && r.rcept_no ? `https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${r.rcept_no}` : null;
const st = {g:null, tab:"tree", c:null, u:[], p:null};

$("#title").textContent = D.title;
$("#src").textContent = `출처: ${D.source} · DART 정기보고서 임원현황${D.collected_at ? " · 수집 " + D.collected_at.slice(0,10) : ""}`;
document.title = D.title;

function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  st.g = p.get("g") ? +p.get("g") : null; st.tab = p.get("t") || "tree"; st.c = p.get("c");
  st.u = p.get("u") ? p.get("u").split("›") : [];
  st.p = p.get("p")!=null ? +p.get("p") : null;
}
function go(g, tab, c, u, person){
  const p = new URLSearchParams();
  if (g!=null) p.set("g", g); if (tab) p.set("t", tab); if (c) p.set("c", c); if (u && u.length) p.set("u", u.join("›")); if (person!=null) p.set("p", person);
  location.hash = p.toString();
}
let lastKey = "", lastU = [];
window.addEventListener("hashchange", () => {
  const prev = lastKey, prevU = lastU; readHash(); crumbFull = false;
  const key = `${st.g}|${st.tab}|${st.c}`;
  const sameView = prev === key && prevU.join("›") === st.u.join("›");
  render(); lastKey = key; lastU = st.u.slice();
  if (sameView) return;                      // only the person sheet opened or closed
  const org = document.getElementById("org");
  if (org && prev === key) {
    // going up: bring back the unit we came from; going down: start at the chart
    const back = prevU.length > st.u.length && prevU.slice(0, st.u.length).join("›") === st.u.join("›");
    const from = back && org.querySelector(`[data-u="${CSS.escape(prevU.slice(0, st.u.length+1).join("›"))}"]`);
    if (from) { from.scrollIntoView({block:"center"}); from.classList.add("flash"); }
    else org.scrollIntoView({block:"start"});  // scroll-margin keeps the subbar right under the header
  } else window.scrollTo(0,0);
});
function side(){
  const max = Math.max(...D.groups.map(g=>g.assets_krw_bn));
  $("#side").innerHTML = `<button class="${st.g==null?"on":""}" data-g=""><span class="rk">·</span><span>전체 개요</span><span></span></button>` +
    D.groups.map(g => `<button class="${st.g===g.rank?"on":""}" data-g="${g.rank}"><span class="rk">${g.rank}</span><span>${esc(g.name)}<i class="dot ${g.collected?"ok":""}" title="${g.collected?"공시 수집됨":"공시 미수집"}"></i></span><span class="as">${jo(g.assets_krw_bn)}조</span></button>`).join("");
  $("#side").querySelectorAll("button").forEach(b => b.onclick = () => { $("#side").classList.remove("open"); go(b.dataset.g ? +b.dataset.g : null, b.dataset.g ? "tree" : null); });
}

function overview(){
  const max = Math.max(...D.groups.map(g=>g.assets_krw_bn));
  const rows = D.groups.map(g => {
    const ex = (g.companies||[]).reduce((s,c)=>s+(c.executives?.length||0),0);
    const holding = g.collected ? topHolding(g) : null;
    return `<tr data-g="${g.rank}"><td class="num">${g.rank}</td><td><b>${esc(g.name)}</b> ${g.change?`<span class="tag">${esc(g.change)}</span>`:""}</td><td>${esc(g.same_person)}</td>
      <td>${holding?esc(clean(holding)):'<span class="note">—</span>'}</td>
      <td class="num">${g.affiliate_count}</td><td class="num">${jo(g.assets_krw_bn)}</td><td style="width:120px"><div class="bar" style="width:${(g.assets_krw_bn/max*100).toFixed(1)}%"></div></td>
      <td class="num">${g.collected?ex.toLocaleString():'<span class="tag warn">미수집</span>'}</td></tr>`;}).join("");
  const n = D.groups.filter(g=>g.collected).length;
  return `<div class="head"><h2>기업집단 ${D.groups.length}곳</h2><span class="note">공정위 공정자산총액 순 · 공시 수집 ${n}/${D.groups.length}</span></div>
  ${n<D.groups.length?`<div class="notice">아직 DART 공시를 수집하지 않은 그룹은 공정위 계열사 명단만 보입니다. <code>python scripts/collect.py --rank 1-50</code> 실행 후 다시 빌드하세요.</div>`:""}
  <div class="card tbl"><table class="overview"><thead><tr><th>순위</th><th>기업집단</th><th>동일인</th><th>최상위 회사(지주)</th><th>계열사</th><th>자산(조 원)</th><th></th><th>공시 임원</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Ownership: each company hangs under its largest in-group shareholder.
function tree(g){
  const names = new Set(g.companies.map(c=>c.name));
  const best = {};
  for (const e of g.edges) {
    if (!names.has(e.child)) continue;
    if (e.parent!=="__OWNER__" && !names.has(e.parent)) continue;
    const cur = best[e.child];
    // a company parent wins over the owner's personal stake when it is larger; ties prefer the company
    if (!cur || e.stake > cur.stake || (e.stake===cur.stake && cur.parent==="__OWNER__")) best[e.child] = e;
  }
  // break cycles (cross-holdings such as 모비스 → 현대차 → 기아 → 모비스): cut the weakest link of
  // the loop and hang that company on the 동일인's own stake if there is one, so the loop's
  // strongest chain stays intact under the owner
  const ownerStake = {};
  for (const e of g.edges) if (e.parent==="__OWNER__" && names.has(e.child)) ownerStake[e.child] = e;
  for (let guard=0; guard<1000; guard++) {
    let cycle = null;
    for (const c of Object.keys(best)) {
      const path = [c]; let p = best[c].parent;
      while (p && p!=="__OWNER__" && best[p]) {
        const i = path.indexOf(p);
        if (i >= 0) { cycle = path.slice(i); break; }
        path.push(p); p = best[p].parent;
      }
      if (cycle) break;
    }
    if (!cycle) break;
    const weakest = cycle.reduce((a,b)=>best[b].stake < best[a].stake ? b : a);
    if (ownerStake[weakest]) best[weakest] = ownerStake[weakest]; else delete best[weakest];
  }
  const kids = {};
  for (const [c,e] of Object.entries(best)) (kids[e.parent] ||= []).push({name:c, stake:e.stake, src:e.source});
  return {best, kids};
}
function topHolding(g){
  const {kids} = tree(g);
  const top = (kids.__OWNER__||[]).map(k=>({...k, n:count(kids,k.name)})).sort((a,b)=>b.n-a.n)[0];
  if (top && top.n>0) return top.name;
  const roots = g.companies.filter(c=>kids[c.name] && !Object.values(kids).flat().some(k=>k.name===c.name));
  roots.sort((a,b)=>count(kids,b.name)-count(kids,a.name));
  return roots[0]?.name || null;
}
function count(kids, n, seen=new Set()){ if (seen.has(n)) return 0; seen.add(n); return (kids[n]||[]).reduce((s,k)=>s+1+count(kids,k.name,seen),0); }

function treeView(g){
  const byName = Object.fromEntries(g.companies.map(c=>[c.name,c]));
  const {best, kids} = tree(g);
  const node = (n, stake, depth) => {
    const c = byName[n], ch = (kids[n]||[]).sort((a,b)=>count(kids,b.name)-count(kids,a.name) || b.stake-a.stake);
    const ex = c?.executives?.length || 0;
    const tags = [c?.stock_code?`<span class="tag acc">상장 ${c.stock_code}</span>`:"", c?.financial?`<span class="tag fin">금융</span>`:""].join("");

  if (loose.length) html += `<div class="card"><h3>지분 연결 정보가 없는 계열사 <span class="note">${loose.length}곳</span></h3><p class="note">DART 정기보고서를 내지 않는 비상장사 등은 출자 관계를 공시에서 확인할 수 없습니다.</p><div class="chips">${loose.map(c=>`<button ${c.executives?.length?`data-c="${esc(c.name)}"`:"disabled"}>${esc(clean(c.name))}${c.financial?" <small>금융</small>":""}</button>`).join("")}</div></div>`;
  return html;
}

/* ---------- helpers for the executive views ---------- */
const RANKS = ["회장","부회장","사장","부사장","전무","상무","상무보","이사"];
const rankOf = p => { const s=(p||"").replace(/\s/g,""); const i=RANKS.indexOf(s); if (i>=0) return i; const j=RANKS.findIndex(r=>s.endsWith(r)); return j>=0 ? j+0.5 : 50; };

const cj = s => (s||"").replace(/^[\sㆍ·-]+/,"").replace(/\s*ㆍ\s*/g," · ").replace(/\s{2,}/g," ").trim();
const CAT = {biz:["사업부문","var(--c1)"], rnd:["연구·기술","var(--c2)"], fn:["전사 기능","var(--c5)"], staff:["경영지원","var(--c3)"], region:["해외·지역","var(--c4)"]};
const TIER = {1:"결정권자",2:"조직장",3:"실무 임원"};
const REF = D.collected_at ? D.collected_at.slice(0,10) : "";
function nodeAt(root, path){ let n=root; for (const u of path){ n=n.children.find(k=>k.name===u); if(!n) return null; } return n; }

function allPeople(n){ return n.people.concat(...n.children.map(allPeople)); }
// a unit's head: named '○○장' in the disclosure; else named so in a linked news story; else the highest rank (a guess)
function headInfo(n, ex){
  if (n.heads?.length) return {i:[...n.heads].sort(byRank(ex))[0], src:"공시"};
  if (n.news_heads?.length) { const h=n.news_heads[0]; return {i:h.i, src:"보도", note:h.src}; }
  return n.people.length ? {i:[...n.people].sort(byRank(ex))[0], src:"추정"} : null;
}
function headOf(n, ex){ return headInfo(n, ex)?.i ?? null; }
function shortJob(job, path){

}
function age(e){ const m=(e.birth_ym||"").match(/(\d{4})\D*(\d{1,2})?/); if(!m) return null; const ref=new Date(REF||Date.now()); let a=ref.getFullYear()-(+m[1]); if (m[2] && ref.getMonth()+1 < +m[2]) a--; return a; }

function careerFirst(e){ const s=(e.main_career||"").split(/\s*(?:ㆍ|·|\n|- )\s*/).map(x=>x.trim()).filter(x=>x && !/대학|대$|Univ|University|College|\(박사|\(석사|\(학사|졸업/.test(x)); return s[0]||""; }
function roleLine(e, path){ const j=shortJob(e.chrg_job, path||[]); return j && j!==e.ofcps ? `${e.ofcps} · ${j}` : (e.ofcps||j); }

// reporting line: heads of the units above a person, nearest first
function chainOf(c, i){

function badges(e){ return `${e.chg?`<i class="b chg ${e.chg==="신규"?"new":e.chg==="승진"?"up":"mv"}">${e.chg}</i>`:""}${e.tier===1?`<i class="b t1">결정권자</i>`:""}${(e.tags||[]).filter(t=>["AI","데이터","DX","IT·보안"].includes(t)).map(t=>`<i class="b tg" title="${esc(`근거: '${e.tag_src?.[t]||""}'`)}">${t}</i>`).join("")}`; }

// AX map: units whose NAME says AI·AX·PI·Data·Digital (not the duty keywords of single people), each with its head
// and the line up to the nearest 사장-level head above it. Units reported in the news but not yet disclosed join in.
const AXRX = /(?<![A-Za-z])(AI|AX|PI)(?![A-Za-z])|Data|데이터|Digital(?!\s*(Wallet|Appliance|Display|Health))|디지털|Twin|인공지능/i;
function axMap(g, c){
  const ex=c.executives, out=[];
  // nearest 사장-level head above; failing that, the topmost head above (any rank); none for a top-level unit
  const lineOf = path => { let top=null; for (let k=path.length-1; k>=1; k--){ const n=nodeAt(c.org,path.slice(0,k)); const h=n&&headInfo(n,ex); if (!h) continue; if (rankOf(ex[h.i].ofcps)<=2) return {...h, unit:path[k-1]}; top={...h, unit:path[k-1]}; } return top; };
  const walk=(n,path)=>{ for (const k of n.children){ const p=[...path,k.name]; if (AXRX.test(k.name)) out.push({path:p, size:k.size, head:headInfo(k,ex), line:lineOf(p)}); walk(k,p); } };
  if (c.org) walk(c.org,[]);
  for (const x of (g.news||[])) if (x.company===c.name && x.event===x.id && x.new_unit && x.confirm>=2 && AXRX.test(x.new_unit.name))
    out.push({path:[...x.new_unit.parent, x.new_unit.name], size:0, ghost:x, head:null, line:x.new_unit.parent.length?(()=>{ const n=nodeAt(c.org,x.new_unit.parent); const h=n&&headInfo(n,ex); return h&&rankOf(ex[h.i].ofcps)<=2?{...h,unit:x.new_unit.parent.slice(-1)[0]}:lineOf([...x.new_unit.parent,"_"]); })():null});

function axSponsors(g, c){

let crumbFull = false;
function subbar(c, at){
  const sep = '<span class="sep">›</span>';
  const btn = (label, u, cls="") => `<span class="ci ${cls}">${sep}<button data-u="${esc(u)}">${esc(label)}</button></span>`;
  let html;
  if (!at.length) html = `<span class="cur">${esc(clean(c.name))} 전체</span>`;
  else {
    const fold = at.length>=3 && !crumbFull;
    html = `<span class="ci"><button data-u="">${esc(clean(c.name))}</button></span>`
      + (fold ? `<span class="ci">${sep}<button class="dots" data-dots="1" aria-label="경로 전체 보기">…</button></span>` + btn(at[at.length-2], at.slice(0,-1).join("›"))
              : at.slice(0,-1).map((u,i)=>btn(u, at.slice(0,i+1).join("›"))).join(""))
      + `<span class="ci cur">${sep}<span>${esc(at[at.length-1])}</span></span>`;
  }
  return `<div class="subbar">${at.length?`<button class="up" data-u="${esc(at.slice(0,-1).join("›"))}" aria-label="상위 조직으로">← 상위</button>`:""}<div class="crumb ${at.length>=3&&!crumbFull?"fold":""}">${html}</div>${at.length?`<span class="lv">${at.length}단계</span>`:""}</div>`;
}

const TAGS = ["AI","데이터","DX","IT·보안","전략","구매","인사","재무","영업·마케팅"];
const tf = {tags:new Set(["AI","데이터","DX","IT·보안"]), tier:new Set([1,2]), onlyNew:false, comp:"", show:40, sort:"tier"};
function targetRows(g){
  const out=[];
  for (const c of g.companies) { if (!c.executives?.length || (tf.comp && c.name!==tf.comp)) continue;
    const mentioned = new Set((g.news||[]).filter(n=>n.company===c.name).flatMap(n=>n.pids));
    c.executives.forEach((e,i)=>{
      const t=(e.tags||[]); if (tf.tags.size && !t.some(x=>tf.tags.has(x))) return;
      if (!tf.tier.has(e.tier||3)) return; if (tf.onlyNew && !e.chg) return;
      const fx = t.filter(x=>["AI","데이터","DX","IT·보안"].includes(x)).length;
      const parts = [[TIER[e.tier||3], {1:50,2:30,3:10}[e.tier||3]], ["AI·데이터·DX·IT", Math.min(fx,2)*15], [e.chg||"", e.chg==="신규"?15:e.chg==="승진"?10:e.chg==="이동"?5:0], ["보도", mentioned.has(i)?10:0], ["등기", isReg(e)?5:0]].filter(p=>p[1]);
      const score = parts.reduce((s,p)=>s+p[1],0);
      const warn = (g.news||[]).some(n=>n.company===c.name && n.pids.includes(i) && n.category==="인사" && n.kind==="확정" && c.report?.stlm_dt && n.date > c.report.stlm_dt);
      out.push({c,i,e,score,parts,warn,path:c.org?(pathOf(c.org,i)||[]):[],news:mentioned.has(i)});
    });
  }
  // budget owners first by default: tier, then score; or plain score
  return out.sort((a,b)=>(tf.sort==="tier" ? (a.e.tier||3)-(b.e.tier||3) : 0) || b.score-a.score || rankOf(a.e.ofcps)-rankOf(b.e.ofcps));
}

  const g = D.groups.find(x=>x.rank===st.g);
  const m = $("#main");
  m.innerHTML = (g ? groupView(g) : overview()) + `<p class="foot">${esc($("#src").textContent)}<br>공정위 계열사 명단과 DART 정기보고서 '임원 및 직원 등의 현황'을 자동으로 모은 자료입니다. 보고서 기준일 이후의 인사 변동은 반영되지 않습니다.${g?.news?.length?" 보도는 웹 검색으로 따로 모았으며 공시 자료와 구분해 표시합니다.":""}</p>`;
  if (!g) { m.querySelectorAll("tr[data-g]").forEach(tr=>tr.onclick=()=>go(+tr.dataset.g,"tree")); return; }
  const comps = g.companies.filter(x=>x.executives?.length).sort((a,b)=>b.executives.length-a.executives.length);
  const c = comps.find(x=>x.name===st.c) || comps[0];
  m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go(g.rank,b.dataset.t, st.c));
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=ev=>{ev.preventDefault(); go(g.rank,"org",b.dataset.c);});
  m.querySelectorAll(".tog").forEach(b=>b.tagName==="BUTTON" && (b.onclick=()=>{const ul=b.parentElement.querySelector(":scope>ul"); ul.hidden=!ul.hidden; b.classList.toggle("open", !ul.hidden);}));
  m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go(g.rank,"org",c.name,st.u,+b.dataset.p));
  m.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    const cc = b.dataset.cc || c.name, u = b.dataset.u ? b.dataset.u.split("›") : [];
    if (cc===c.name && st.tab==="org") scrollMemo[st.u.join("›")] = window.scrollY;
    go(g.rank,"org",cc,u);
  });
  m.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>{ const cc=g.companies.find(x=>x.name===b.dataset.cc); go(g.rank,"org",cc.name,pathOf(cc.org,+b.dataset.pp)||[],+b.dataset.pp); });
  m.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{ const t=b.dataset.tag; tf.tags.has(t)?tf.tags.delete(t):tf.tags.add(t); tf.show=40; render(); });
  m.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{ const t=+b.dataset.tier; tf.tier.has(t)?tf.tier.delete(t):tf.tier.add(t); tf.show=40; render(); });
  m.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{ tf.onlyNew=!tf.onlyNew; render(); });
  const tc=$("#tcomp"); if (tc) tc.onchange=()=>{ tf.comp=tc.value; tf.show=40; render(); };
  const tm=$("#tmore"); if (tm) tm.onclick=()=>{ tf.show+=40; const y=window.scrollY; render(); window.scrollTo(0,y); };
  m.querySelectorAll(".apr .lk").forEach(b=>b.onclick=()=>{ const cc=g.companies.find(x=>x.name===b.dataset.tc); go(g.rank,"target",cc.name,[],+b.dataset.ti); });
  m.querySelectorAll(".trow").forEach(b=>b.onclick=()=>{ const cc=g.companies.find(x=>x.name===b.dataset.tc); go(g.rank,"target",cc.name,[],+b.dataset.ti); });
  const cv=$("#csv"); if (cv) cv.onclick=async()=>{
    const name=`${g.name}_주요임원.csv`, data=csvOf(g);
    // inside the claude.ai viewer a file goes through the downloads capability; opened as a local file, a plain link works
    const dl = window.claude?.use ? await window.claude.use("downloads").catch(()=>null) : null;
    if (dl) { try { await dl.save({filename:name, data}); cv.textContent="저장됨 ✓"; } catch(e){ cv.textContent = e?.code==="declined" ? "취소됨" : "저장 불가 · 표 복사 사용"; } return; }
    try { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); } catch(e){ cv.textContent="저장 불가 · 표 복사 사용"; }
  };
  const cc2=$("#csvcopy"); if (cc2) cc2.onclick=async()=>{ const tsv=csvOf(g).replace(/^﻿/,"").split("\n").map(l=>l.replace(/^"|"$/g,"").split('","').join("\t")).join("\n"); try { await navigator.clipboard.writeText(tsv); cc2.textContent="복사됨 ✓"; } catch(e){ const t=document.createElement("textarea"); t.value=tsv; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); cc2.textContent="복사됨 ✓"; } };
  m.querySelectorAll("[data-jump]").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); document.getElementById(a.dataset.jump)?.scrollIntoView({block:"start"}); });
  m.querySelectorAll("[data-dots]").forEach(b=>b.onclick=()=>{ crumbFull=true; const y=window.scrollY; render(); window.scrollTo(0,y); });
  m.querySelectorAll("[data-bf]").forEach(b=>b.onclick=()=>{ bf.comp=b.dataset.bf; render(); document.querySelector(".tabs")?.scrollIntoView({block:"start"}); });
  m.querySelectorAll("[data-ncat]").forEach(b=>b.onclick=()=>{ nf.cat=b.dataset.ncat; render(); });
  m.querySelectorAll("[data-ncomp]").forEach(b=>b.onclick=()=>{ nf.comp=b.dataset.ncomp; render(); });
  fitStackLabels();
  m.querySelector(".tabs button.on")?.scrollIntoView({inline:"nearest", block:"nearest"});
  if (st.p!=null && (c?.executives||[])[st.p]) person(g, c, st.p); else if ($("#dlg").open) $("#dlg").close();
}

// search across groups, companies and people
const idx = [];
for (const g of D.groups) {
  idx.push({k:g.name+" "+(g.aliases||[]).join(" ")+" "+g.same_person, label:g.name, sub:`${g.rank}위 기업집단`, go:()=>go(g.rank,"tree")});
  for (const c of g.companies) {
    idx.push({k:c.name+" "+(c.dart_name||""), label:clean(c.name), sub:`${g.name} 계열사`, go:()=>go(g.rank, c.executives?.length?"org":"list", c.name)});
    (c.executives||[]).forEach((e,i)=>idx.push({k:e.nm, label:e.nm, sub:`${clean(c.name)} · ${e.ofcps||""} · ${e.chrg_job||""}`, go:()=>go(g.rank,"org",c.name, c.org?pathOf(c.org,i)||[]:[], i)}));
  }
}
const q = $("#q"), res = $("#res");
q.addEventListener("input", () => {
  const s = q.value.trim().replace(/\s+/g,"");
  if (!s) { res.classList.remove("on"); return; }
  const hits = idx.filter(x=>x.k.replace(/\s+/g,"").includes(s)).slice(0,40);
  res.innerHTML = hits.length ? hits.map((h,i)=>`<button data-i="${i}">${esc(h.label)} <small>${esc(h.sub)}</small></button>`).join("") : `<div class="note" style="padding:10px 12px">결과 없음</div>`;
  res.querySelectorAll("button").forEach(b=>b.onclick=()=>{hits[+b.dataset.i].go(); res.classList.remove("on"); q.blur();});
  res.classList.add("on");
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.classList.remove("on"); });

readHash();
if (st.g==null && D.groups.length===1) st.g = D.groups[0].rank;
render(); lastKey = `${st.g}|${st.tab}|${st.c}`; lastU = st.u.slice();
if (st.u.length) document.getElementById("org")?.scrollIntoView({block:"start"});
if (st.u.length) document.getElementById("org")?.scrollIntoView({block:"start"});
</script>
</body>
</html>
